<script>
  /**
   * Encapsulated Dashboard Application Module
   */
  const DashboardApp = (function () {
    let rawData = null;
    let activeRangeDays = 30;
    let mainChartInstance = null;
    let resizeTimer = null;
    let stalenessUpdateTimer = null;
    let lastSnapshotTime = null;
    let lastSheetFetchTime = null;
    let autoFetchEnabled = true;
    let autoFetchIntervalMs = 30 * 60 * 1000; // Default 30 minutes
    let autoFetchTimer = null;
    let lastAutoFetchTime = Date.now();

    // Magic number constants
    const RESIZE_DEBOUNCE_MS = 300;
    const STALENESS_UPDATE_INTERVAL_MS = 10 * 1000;
    const NOTIFICATION_ANIMATION_MS = 250;
    const NOTIFICATION_ERROR_DURATION_MS = 5000;
    const MS_PER_DAY = 1000 * 60 * 60 * 24;
    const DOWNSAMPLE_TARGET_BUCKETS = 50;
    const ROLLING_AVG_WINDOW_MIN = 5;
    const ROLLING_AVG_WINDOW_MAX = 168;
    const ROLLING_AVG_TARGET_BUCKETS = 20;
    const ROLLING_AVG_OPACITY = 0.6;
    const ROLLING_AVG_LINE_DASH = [5, 5];
    const VELOCITY_WINDOW_1D = 1;
    const VELOCITY_WINDOW_3D = 3;
    const VELOCITY_WINDOW_7D = 7;
    const ETA_THRESHOLD_GOOD = 14;
    const ETA_THRESHOLD_CAUTION = 30;
    const WEEKEND_BAND_COLOR = 'rgba(95, 99, 104, 0.08)';

    // Trajectory Weather landscape constants
    const LANDSCAPE_BASELINE_WINDOW_DAYS = 14;
    const LANDSCAPE_ALL_RANGE_WINDOW_DAYS = 30;
    const LANDSCAPE_TRANSITION_DURATION_S = 0.75;  // 0.75s smooth transition on range change
    const LANDSCAPE_METRIC_NEUTRAL = 0.5;
    const LANDSCAPE_TREND_CENTER = 0.85;
    const LANDSCAPE_TREND_SCALE = 0.3;
    const LANDSCAPE_MAX_FRAME_DT = 0.05;
    const LANDSCAPE_TRANSITION_FPS = 30; // cap during morphs; idle costs nothing (on-demand rendering)
    const LANDSCAPE_FRAME_MIN_MS = 1000 / LANDSCAPE_TRANSITION_FPS;
    const LANDSCAPE_MOBILE_WIDTH = 768; // below this, DPR is capped for fill-rate savings
    const LANDSCAPE_MOBILE_DPR = 1.5;
    const LANDSCAPE_DESKTOP_DPR = 2;
    const LANDSCAPE_CLOUD_CAP = 25; // max timeline clouds; oldest-first downsample, latest kept
    const LANDSCAPE_RECENT_WINDOW_DAYS = 3; // per-snapshot metric numerator window
    const LANDSCAPE_SLOW_REFRESH_MS = 60000; // re-evaluate daylight/cloud ages when idle
    const LANDSCAPE_MOON = { x: 0.24, y: 0.16 }; // own slot, never overlaps the sun path
    // Fire overlay: dedicated tiny canvas over the campfire only, so flames
    // can animate cheaply while the main scene stays on-demand.
    const LANDSCAPE_FIRE_OVERLAY_W = 240;
    const LANDSCAPE_FIRE_OVERLAY_H = 320;
    // Fire point sits 120px above the overlay bottom so the ground glow
    // (radius ~107px worst case: night boost + flicker peak) never clips
    // into a hard edge.
    const LANDSCAPE_FIRE_ANCHOR_DY = 120;
    const LANDSCAPE_FIRE_FPS = 12;
    const LANDSCAPE_FIRE_FLAMES = 14;
    const LANDSCAPE_FIRE_SPARKS = 8;
    const LANDSCAPE_GROUND_TOP = 0.78;
    const LANDSCAPE_CABIN = { x: 0.16, w: 110, h: 128 };
    const LANDSCAPE_FIRE = { x: 0.30, s: 0.8 };
    const LANDSCAPE_SAFE_ZONES = [
      { x: LANDSCAPE_CABIN.x, r: 0.10 },
      { x: LANDSCAPE_FIRE.x, r: 0.08 }
    ];

    /**
     * Color definitions for consistent stacked line/area and overlay line visualization.
     */
    const SERIES_COLORS = {
      onTimeOpen: '#1a73e8', // Blue (On-time open tasks)
      overdue: '#d93025',    // Red (Overdue open tasks)
      completed: '#188038',  // Green (Completed tasks)
      severity: '#a142f4'    // Purple (Severity line overlay on right axis)
    };

    /**
     * Extracts task weight from title prefix (mirrors backend implementation).
     * Prefix rules: no prefix = 1, "!" = 2, "!!" = 3, "!!!" = 4, "!!!!" = 5.
     * @param {string} title - Task title
     * @return {number} - Weight (1-5)
     */
    function getTaskWeight(title) {
      if (!title || typeof title !== 'string') return 1;
      const match = title.match(/^!{1,4}/);
      if (!match) return 1;
      return match[0].length + 1;
    }

    // -----------------------------------------------------------------------
    // Trajectory Weather — background landscape layer
    // -----------------------------------------------------------------------
    const Landscape = (function () {
      let canvas, ctx;
      let backdropCanvas, backdropCtx;
      let foregroundCanvas, foregroundCtx;
      let dpr = 1;
      let W = 0, H = 0;
      let houseChimney = null; // normalized chimney tip, stored for the smoke pass (stage 4)
      let grainTile = null;
      let lastFrameTs = null;
      let lastPaintTs = 0;
      let started = false;
      let rafRunning = false;
      let fireCanvas = null, fireCtx = null;
      let fireRunning = false, fireLastPaint = 0;

      const REDUCED_MOTION = !!(window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      const state = {
        currentMetric: LANDSCAPE_METRIC_NEUTRAL,
        targetMetric: LANDSCAPE_METRIC_NEUTRAL,
        startMetric: LANDSCAPE_METRIC_NEUTRAL,  // snapshot of where the transition started
        transitionProgress: 1.0,
        activeRangeHours: 72 // default 3D, updated by setRangeFilter
      };

      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smoothstep(a, b, x) {
        const t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }

      // ---------------------------------------------------------------- daylight
      // Sibiu, Romania (45.8N): fixed base hours + sinusoidal seasonal shift.
      // Summer solstice -> ~05:34/21:00, winter -> ~08:10/16:36 (±20 min;
      // dawn/dusk windows are 60-75 min wide). Product seam: replace the
      // internals with the sunrise equation once real lat/lon exists.
      function sunTimes(dayOfYear) {
        const w = 2 * Math.PI * (dayOfYear - 172) / 365;
        return {
          rise: 6 + 52 / 60 - (78 / 60) * Math.cos(w),
          set: 18 + 48 / 60 + (132 / 60) * Math.cos(w)
        };
      }
      function dayBlendForDate(date) {
        const start = new Date(date.getFullYear(), 0, 0);
        const doy = Math.floor((date - start) / 86400000);
        const { rise, set } = sunTimes(doy);
        const h = date.getHours() + date.getMinutes() / 60;
        const day = smoothstep(rise - 0.75, rise + 0.5, h) *
          (1 - smoothstep(set - 0.5, set + 0.75, h));
        const nearest = Math.min(Math.abs(h - rise), Math.abs(h - set));
        const dusk = clamp(1 - nearest / 1.2, 0, 1);
        return { day: day, dusk: dusk, h: h, rise: rise, set: set };
      }
      const sunPos = { x: 0.78, y: 0.20 }; // updated per frame from time of day
      // Sun travels east->west and touches the horizon at rise/set.
      // Returns day progress p (0 at sunrise, 1 at sunset) for shadow length.
      function updateSunPos(h, rise, set) {
        const p = clamp((h - rise) / Math.max(0.5, set - rise), 0, 1);
        sunPos.x = 0.18 + 0.64 * p;
        sunPos.y = 0.62 - Math.sin(Math.PI * p) * 0.49;
        return p;
      }

      /**
       * Deterministic pseudo-random hash for decorrelating cloud properties.
       * Using the snapshot timestamp keeps each cloud stable when rows are
       * added or removed, while avoiding correlation with its row position.
       */
      function pseudoRandom(seed) {
        const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      /**
       * Sets the target metric for the current range. Triggers a smooth
       * transition rather than snapping. Called from setRangeFilter() and
       * whenever fresh data loads.
       */
      function setTargetMetric(metric) {
        if (Math.abs(state.targetMetric - metric) > 0.005) {
          state.startMetric = state.currentMetric;  // capture where we are NOW
          state.targetMetric = metric;
          if (REDUCED_MOTION) {
            // No animation: snap and paint a single frame.
            state.currentMetric = metric;
            state.transitionProgress = 1.0;
          } else {
            state.transitionProgress = 0.0;
          }
          kickTransitionLoop();
        }
      }

      function setActiveRangeDays(rangeDays) {
        const effectiveDays = (rangeDays === 'all') ? LANDSCAPE_ALL_RANGE_WINDOW_DAYS : (Number(rangeDays) || LANDSCAPE_ALL_RANGE_WINDOW_DAYS);
        state.activeRangeHours = effectiveDays * 24;
      }

      function updateTransition(dt) {
        if (state.transitionProgress < 1.0) {
          state.transitionProgress = Math.min(1.0, state.transitionProgress + dt / LANDSCAPE_TRANSITION_DURATION_S);
          // Lerp from startMetric → targetMetric, not from currentMetric → targetMetric
          state.currentMetric = lerp(state.startMetric, state.targetMetric, state.transitionProgress);
        }
      }

      function resize() {
        if (!canvas) return;
        W = window.innerWidth;
        H = window.innerHeight;
        const dprCap = W < LANDSCAPE_MOBILE_WIDTH ? LANDSCAPE_MOBILE_DPR : LANDSCAPE_DESKTOP_DPR;
        dpr = Math.min(window.devicePixelRatio || 1, dprCap);

        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        drawBackdrop();
        drawForeground();
        layoutFireOverlay();
        render(Date.now() / 1000);
      }

      function getGrainTile() {
        if (grainTile) return grainTile;
        grainTile = document.createElement('canvas');
        grainTile.width = grainTile.height = 128;
        const g = grainTile.getContext('2d');
        const img = g.createImageData(128, 128);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = 118 + Math.floor(Math.random() * 20);
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        return grainTile;
      }

      // Three sine-composed ranges, far (pale) to near (dark). Polylines
      // nest: no range dips below the silhouette in front, near range never
      // below the horizon.
      const RANGES = [
        { base: 0.55, amp: 0.13, f1: 2.1, f2: 5.3, p1: 0.7, p2: 2.9, color: '#b9cfc9' },
        { base: 0.64, amp: 0.12, f1: 2.8, f2: 6.7, p1: 2.1, p2: 0.4, color: '#8fb3a6' },
        { base: 0.72, amp: 0.10, f1: 3.6, f2: 8.9, p1: 4.2, p2: 1.3, color: '#5f8272' }
      ];
      function ridgeY(r, x) {
        const t = x / W;
        return (r.base - r.amp * (0.62 * Math.sin(t * Math.PI * 2 * r.f1 + r.p1) +
                                 0.38 * Math.sin(t * Math.PI * 2 * r.f2 + r.p2))) * H;
      }
      function rangePoly(r) {
        const pts = [];
        for (let x = 0; x <= W; x += 8) pts.push([x, ridgeY(r, x)]);
        return pts;
      }
      function drawPoly(c, pts, color) {
        c.fillStyle = color;
        c.beginPath();
        c.moveTo(0, H);
        for (const [x, y] of pts) c.lineTo(x, y);
        c.lineTo(W, H);
        c.closePath();
        c.fill();
      }
      // Snowcaps with mass: filled caps whose depth scales with peak height.
      function drawSnowcaps(c, pts) {
        const SNOW_Y = H * 0.47;
        const segs = [];
        let cur = null;
        for (const [x, y] of pts) {
          if (y < SNOW_Y) {
            if (!cur) cur = [];
            cur.push([x, y]);
          } else if (cur) { segs.push(cur); cur = null; }
        }
        if (cur) segs.push(cur);
        c.fillStyle = 'rgba(244,248,250,0.92)';
        for (const seg of segs) {
          if (seg.length < 2) continue;
          c.beginPath();
          c.moveTo(seg[0][0], seg[0][1]);
          for (const [x, y] of seg) c.lineTo(x, y);
          for (let i = seg.length - 1; i >= 0; i--) {
            const [x, y] = seg[i];
            c.lineTo(x, y + clamp((SNOW_Y - y) * 1.8, 5, 30));
          }
          c.closePath();
          c.fill();
        }
        c.strokeStyle = 'rgba(255,255,255,0.9)';
        c.lineWidth = 3;
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.beginPath();
        let pen = false;
        for (const [x, y] of pts) {
          if (y < SNOW_Y) {
            if (!pen) { c.moveTo(x, y); pen = true; }
            else c.lineTo(x, y);
          } else {
            pen = false;
          }
        }
        c.stroke();
      }
      function drawBackdrop() {
        backdropCanvas.width = W * dpr;
        backdropCanvas.height = H * dpr;
        backdropCanvas.style.width = W + 'px';
        backdropCanvas.style.height = H + 'px';
        backdropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const sky = backdropCtx.createLinearGradient(0, 0, 0, H * 0.7);
        sky.addColorStop(0, '#9fc4cf');
        sky.addColorStop(1, '#e4ecec');
        backdropCtx.fillStyle = sky;
        backdropCtx.fillRect(0, 0, W, H);

        const groundY = LANDSCAPE_GROUND_TOP * H;
        const polys = RANGES.map(rangePoly);
        // Near range never dips below the horizon.
        for (const p of polys[2]) p[1] = Math.min(p[1], groundY - 2);
        // Back ranges never dip below the silhouette in front of them.
        for (let i = 1; i >= 0; i--) {
          const front = polys[i + 1];
          for (let k = 0; k < polys[i].length; k++) {
            polys[i][k][1] = Math.min(polys[i][k][1], front[k][1] + 4);
          }
        }
        drawPoly(backdropCtx, polys[0], RANGES[0].color);
        drawSnowcaps(backdropCtx, polys[0]);
        drawPoly(backdropCtx, polys[1], RANGES[1].color);
        drawPoly(backdropCtx, polys[2], RANGES[2].color);

        // Vignette to focus the centered content.
        const vig = backdropCtx.createRadialGradient(
          W / 2, H * 0.45, Math.min(W, H) * 0.35,
          W / 2, H * 0.45, Math.max(W, H) * 0.75
        );
        vig.addColorStop(0, 'rgba(20,30,40,0)');
        vig.addColorStop(1, 'rgba(20,30,40,0.22)');
        backdropCtx.fillStyle = vig;
        backdropCtx.fillRect(0, 0, W, H);

        // Subtle film grain to kill gradient banding.
        backdropCtx.save();
        backdropCtx.globalAlpha = 0.05;
        backdropCtx.fillStyle = backdropCtx.createPattern(getGrainTile(), 'repeat');
        backdropCtx.fillRect(0, 0, W, H);
        backdropCtx.restore();
      }

      // Irregular conifer-silhouette rows (varied heights/widths/spacing)
      // instead of a regular zigzag, plus a solid skirt so no sky can
      // peek through at the horizon.
      function coniferRow(c, baseY, color, seedOff, hMin, hMax) {
        c.fillStyle = color;
        c.beginPath();
        c.moveTo(-4, baseY + 60);
        c.lineTo(-4, baseY);
        let x = 0, k = 0;
        while (x < W + 20) {
          const h = hMin + pseudoRandom(k * 1.93 + seedOff) * (hMax - hMin);
          const w = 9 + pseudoRandom(k * 3.11 + seedOff) * 11;
          const cx = x + w / 2;
          const jy = (pseudoRandom(k * 7.7 + seedOff) - 0.5) * 8;
          c.lineTo(cx - w * 0.42, baseY + jy * 0.3);
          c.lineTo(cx, baseY - h + jy);
          c.lineTo(cx + w * 0.42, baseY + jy * 0.3);
          x += w * (0.55 + pseudoRandom(k * 5.23 + seedOff) * 0.5);
          k++;
        }
        c.lineTo(W + 4, baseY + 60);
        c.closePath();
        c.fill();
      }
      function drawTreeline(c) {
        const y0 = RANGES[2].base * H + 6;
        coniferRow(c, y0 + 12, '#3d5f4e', 7.7, 22, 52); // back row, darker
        coniferRow(c, y0 + 28, '#476b58', 3.1, 14, 36); // front row
        c.fillStyle = '#476b58';
        c.fillRect(0, y0 + 28, W, H);
      }

      function drawTree(c, x, y, h, dark, shade, rim) {
        const w = h * 0.55;
        // Long soft shadow away from a low sun (colored, never black).
        if (shade && shade.alpha > 0.01) {
          c.fillStyle = 'rgba(20,26,40,' + (0.20 * shade.alpha).toFixed(3) + ')';
          c.beginPath();
          c.ellipse(x + shade.dx * h, y + 6, h * 0.45, 8, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.fillStyle = dark ? '#2f4a30' : '#3f5f3a';
        c.beginPath();
        c.moveTo(x, y - h);
        c.lineTo(x - w * 0.5, y - h * 0.35);
        c.lineTo(x - w * 0.32, y - h * 0.35);
        c.lineTo(x - w * 0.62, y + h * 0.08);
        c.lineTo(x - w * 0.4, y + h * 0.08);
        c.lineTo(x - w * 0.7, y + h * 0.42);
        c.lineTo(x + w * 0.7, y + h * 0.42);
        c.lineTo(x + w * 0.4, y + h * 0.08);
        c.lineTo(x + w * 0.62, y + h * 0.08);
        c.lineTo(x + w * 0.32, y - h * 0.35);
        c.lineTo(x + w * 0.5, y - h * 0.35);
        c.closePath();
        c.fill();
        // Sun-side highlight sliver.
        c.fillStyle = dark ? 'rgba(120,150,110,0.5)' : 'rgba(150,180,135,0.55)';
        c.beginPath();
        c.moveTo(x, y - h);
        c.lineTo(x + w * 0.5, y - h * 0.35);
        c.lineTo(x + w * 0.32, y - h * 0.35);
        c.lineTo(x + w * 0.12, y - h * 0.62);
        c.closePath();
        c.fill();
        // Warm rim on the sun-facing sliver at dusk.
        if (rim > 0.02) {
          c.fillStyle = 'rgba(255,170,90,' + (0.55 * rim).toFixed(3) + ')';
          c.beginPath();
          c.moveTo(x, y - h);
          c.lineTo(x + w * 0.5, y - h * 0.35);
          c.lineTo(x + w * 0.32, y - h * 0.35);
          c.lineTo(x + w * 0.12, y - h * 0.62);
          c.closePath();
          c.fill();
        }
        c.fillStyle = 'rgba(0,0,0,.18)';
        c.fillRect(x - 3, y + h * 0.42, 6, h * 0.12);
      }

      function drawHouse(c, x, y, w, h, shade, rim) {
        c.fillStyle = 'rgba(0,0,0,0.15)';
        c.beginPath(); c.ellipse(x, y + 6, w * 0.75, 10, 0, 0, Math.PI * 2); c.fill();
        if (shade && shade.alpha > 0.01) {
          c.fillStyle = 'rgba(20,26,40,' + (0.20 * shade.alpha).toFixed(3) + ')';
          c.beginPath();
          c.ellipse(x + shade.dx * h * 0.9, y + 6, w * 0.85, 11, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.fillStyle = '#5a7a6e';
        c.fillRect(x - w / 2, y - h * 0.55, w, h * 0.55);
        // Log lines.
        c.strokeStyle = 'rgba(0,0,0,0.12)';
        c.lineWidth = 1.5;
        for (let i = 1; i < 5; i++) {
          const ly = y - h * 0.55 + (h * 0.55 * i) / 5;
          c.beginPath(); c.moveTo(x - w / 2, ly); c.lineTo(x + w / 2, ly); c.stroke();
        }
        // Roof with overhang + ridge shadow.
        c.fillStyle = '#8b6f47';
        c.beginPath();
        c.moveTo(x - w / 2 - 10, y - h * 0.55);
        c.lineTo(x, y - h * 1.02);
        c.lineTo(x + w / 2 + 10, y - h * 0.55);
        c.closePath(); c.fill();
        c.fillStyle = 'rgba(0,0,0,0.18)';
        c.beginPath();
        c.moveTo(x, y - h * 1.02);
        c.lineTo(x + w / 2 + 10, y - h * 0.55);
        c.lineTo(x + w / 2 - 12, y - h * 0.55);
        c.lineTo(x, y - h * 0.86);
        c.closePath(); c.fill();
        // Warm rim along the roof ridge at dusk.
        if (rim > 0.02) {
          c.strokeStyle = 'rgba(255,170,90,' + (0.5 * rim).toFixed(3) + ')';
          c.lineWidth = 3;
          c.beginPath();
          c.moveTo(x - w / 2 - 10, y - h * 0.55);
          c.lineTo(x, y - h * 1.02);
          c.lineTo(x + w / 2 + 10, y - h * 0.55);
          c.stroke();
        }
        // Door + warm windows.
        c.fillStyle = '#3d4a47';
        c.fillRect(x - 15, y - 42, 30, 42);
        c.fillStyle = '#ffd97a';
        c.fillRect(x - w / 2 + 16, y - h * 0.36, 22, 22);
        c.fillRect(x + w / 2 - 38, y - h * 0.36, 22, 22);
        c.fillStyle = 'rgba(255,217,122,0.35)';
        c.fillRect(x - w / 2 + 12, y - h * 0.36 - 4, 30, 30);
        c.fillRect(x + w / 2 - 42, y - h * 0.36 - 4, 30, 30);
        // Stone chimney; tip stored normalized for the smoke pass (stage 4).
        c.fillStyle = '#6e6a63';
        c.fillRect(x + w * 0.20, y - h * 1.06, 16, h * 0.42);
        houseChimney = {
          nx: (x + w * 0.20 + 8) / W, ny: (y - h * 1.06) / H,
          windows: [
            { x: x - w / 2 + 16, y: y - h * 0.36, w: 22, h: 22 },
            { x: x + w / 2 - 38, y: y - h * 0.36, w: 22, h: 22 }
          ]
        };
        return houseChimney;
      }

      // Campfire static base: stone ring + crossed logs (flames arrive in stage 4).
      function drawFireBase(c, x, y) {
        c.fillStyle = 'rgba(0,0,0,0.18)';
        c.beginPath(); c.ellipse(x, y + 8, 64, 12, 0, 0, Math.PI * 2); c.fill();
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2;
          c.fillStyle = i % 2 ? '#8a8d90' : '#75787c';
          c.beginPath();
          c.ellipse(x + Math.cos(a) * 52, y + 4 + Math.sin(a) * 12, 11, 8, 0, 0, Math.PI * 2);
          c.fill();
        }
        const logs = [[-32, -6, 30, 6], [30, -4, -30, 8], [0, -12, 4, 10]];
        c.lineCap = 'round';
        c.strokeStyle = '#5a4028';
        c.lineWidth = 11;
        for (const [x1, y1, x2, y2] of logs) {
          c.beginPath(); c.moveTo(x + x1, y + y1); c.lineTo(x + x2, y + y2); c.stroke();
        }
        c.strokeStyle = '#7a5a38';
        c.lineWidth = 4;
        for (const [x1, y1, x2, y2] of logs) {
          c.beginPath(); c.moveTo(x + x1, y + y1 - 2); c.lineTo(x + x2, y + y2 - 2); c.stroke();
        }
        c.lineCap = 'butt';
      }

      // Rejection sampling: no two trunks closer than ~0.055, so canopies
      // cannot merge into one blob. Deterministic: stable across resizes.
      const PINES = [];
      {
        let guard = 0;
        while (PINES.length < 17 && guard++ < 500) {
          const x = pseudoRandom(guard * 1.71 + 0.13);
          if (PINES.some((p) => Math.abs(p.x - x) < 0.055)) continue;
          PINES.push({ x: x, s: 0.8 + pseudoRandom(guard * 3.3) * 1.0, dark: pseudoRandom(guard * 7.9) > 0.5 });
        }
      }
      function inSafeZone(nx) {
        return LANDSCAPE_SAFE_ZONES.some((z) => Math.abs(nx - z.x) < z.r);
      }

      function drawForeground() {
        foregroundCanvas.width = W * dpr;
        foregroundCanvas.height = H * dpr;
        foregroundCanvas.style.width = W + 'px';
        foregroundCanvas.style.height = H + 'px';
        foregroundCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        foregroundCtx.clearRect(0, 0, W, H);

        const groundTop = H * LANDSCAPE_GROUND_TOP;
        const ground = foregroundCtx.createLinearGradient(0, groundTop, 0, H);
        ground.addColorStop(0, '#446354');
        ground.addColorStop(1, '#2c4326');
        foregroundCtx.fillStyle = ground;
        foregroundCtx.fillRect(0, groundTop, W, H - groundTop);

        drawTreeline(foregroundCtx);
      }

      // Foreground actors drawn per frame (they take time-of-day light).
      function drawPinesGround(shade, rim) {
        const groundTop = H * LANDSCAPE_GROUND_TOP;
        for (const p of PINES) {
          if (inSafeZone(p.x)) continue; // keep cabin + campfire clearing open
          drawTree(ctx, p.x * W, groundTop + 8, 64 * p.s, p.dark, shade, rim);
        }
      }

      function drawCabinGround(shade, rim) {
        const groundTop = H * LANDSCAPE_GROUND_TOP;
        return drawHouse(ctx, LANDSCAPE_CABIN.x * W, groundTop + 8,
          LANDSCAPE_CABIN.w, LANDSCAPE_CABIN.h, shade, rim);
      }

      function drawFireBaseGround() {
        const groundTop = H * LANDSCAPE_GROUND_TOP;
        ctx.save();
        ctx.translate(LANDSCAPE_FIRE.x * W, groundTop + 26);
        ctx.scale(LANDSCAPE_FIRE.s, LANDSCAPE_FIRE.s);
        drawFireBase(ctx, 0, 0);
        ctx.restore();
      }

      function getCloudPosition(snapshotTimestamp, now) {
        const ageHours = (now - snapshotTimestamp) / (60 * 60 * 1000);
        const effectiveWidth = W * 1.2;
        return W - (ageHours / state.activeRangeHours) * effectiveWidth;
      }

      function css(c, a) {
        return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
      }

      // Seeded puff layouts: positions and aspect derived from the seed,
      // never a fixed stamp. Bottom filler puffs straddle the rim.
      function cloudPuffs(seed) {
        const puffs = [];
        const n = 6 + Math.floor(pseudoRandom(seed) * 3); // 6-8
        for (let k = 0; k < n; k++) {
          const t = n === 1 ? 0.5 : k / (n - 1);
          const j1 = pseudoRandom(seed + k * 3.77), j2 = pseudoRandom(seed + k * 9.13);
          puffs.push({
            dx: (t - 0.5) * 1.55 * (0.85 + j1 * 0.3),       // in units of size
            dy: -Math.sin(Math.PI * clamp(t, 0.02, 0.98)) * 0.34 * (0.8 + j2 * 0.4) + 0.06,
            r: 0.34 + j2 * 0.14
          });
        }
        puffs.push({ dx: -0.42 * (0.9 + pseudoRandom(seed + 51) * 0.2), dy: 0.16, r: 0.30 });
        puffs.push({ dx: 0.44 * (0.9 + pseudoRandom(seed + 77) * 0.2), dy: 0.17, r: 0.32 });
        puffs.push({ dx: (pseudoRandom(seed + 99) - 0.5) * 0.1, dy: 0.20, r: 0.30 });
        return puffs;
      }

      // Stormy (0): flat blue-grey mass, dim tops. Healthy (1): bright,
      // small, dry. Values stay near sky values; contrast lives in the
      // lit top puffs, not in dark balls (dark-to-light order).
      function cloudLook(metric) {
        const t = clamp(metric, 0, 1);
        const dark = [118, 130, 146], light = [255, 255, 255];
        const darkCore = [208, 216, 226];
        const mix = (a, b) => Math.round(a + (b - a) * t);
        return {
          base: [mix(dark[0], light[0]), mix(dark[1], light[1]), mix(dark[2], light[2])],
          core: [mix(darkCore[0], light[0]), mix(darkCore[1], light[1]), mix(darkCore[2], light[2])],
          sizeMul: 1.3 - 0.6 * t,
          opacity: 0.95 - 0.15 * t,
          rain: metric < 0.45
        };
      }

      // Per-snapshot metric: trailing-3d velocity against a trailing-14d
      // baseline, using only data up to the snapshot itself. Immutable by
      // construction; precomputed once per data load.
      function metricAt(rows, idx) {
        const DAY = 86400000;
        const t = new Date(rows[idx][0]).getTime();
        const earliest = new Date(rows[0][0]).getTime();
        const baselineDays = Math.min(14, Math.max(1, (t - earliest) / DAY));
        const rate = (days) => {
          const w = [];
          for (let i = 0; i <= idx; i++) {
            if (new Date(rows[i][0]).getTime() >= t - days * DAY) w.push(rows[i]);
          }
          if (w.length < 2) return null;
          let total = 0;
          for (let i = 1; i < w.length; i++) {
            const d = w[i][2] - w[i - 1][2];
            if (d > 0) total += d;
          }
          const elapsed = Math.max(1, new Date(w[w.length - 1][0]).getTime() - new Date(w[0][0]).getTime()) / DAY;
          return total / elapsed;
        };
        const base = rate(baselineDays);
        const recent = rate(LANDSCAPE_RECENT_WINDOW_DAYS);
        if (base === null || base <= 0 || recent === null) return 0.5;
        return clamp((recent / base - 0.85) / 0.3, 0, 1);
      }

      let metricSeries = []; // per-snapshot metrics aligned with rawData.rows
      let snapshotTimes = []; // numeric timestamps aligned with rawData.rows

      /**
       * Precomputes per-snapshot timeline metrics for freshly loaded rows.
       * Rows are ascending by time, so each trailing-window scan stays short.
       */
      function ingestSnapshots(rows) {
        metricSeries = [];
        snapshotTimes = [];
        for (let i = 0; i < rows.length; i++) {
          snapshotTimes.push(new Date(rows[i][0]).getTime());
        }
        for (let i = 0; i < rows.length; i++) {
          metricSeries.push(metricAt(rows, i));
        }
      }

      function drawCloud(c, x, y, size, seed, look) {
        c.save();
        c.globalAlpha = look.opacity;
        // 1. One flat shadow silhouette for the whole mass. Single fill, no
        // per-puff shading — this is what kills the grey-grapes look.
        const puffs = cloudPuffs(seed);
        c.fillStyle = css(look.base, 0.9);
        c.beginPath();
        c.ellipse(x, y + size * 0.05, size * 0.9, size * 0.34, 0, 0, Math.PI * 2);
        for (const p of puffs) {
          const px = x + p.dx * size, py = y + p.dy * size, pr = p.r * size * 1.1;
          c.moveTo(px + pr, py);
          c.arc(px, py, pr, 0, Math.PI * 2);
        }
        c.fill();
        // 2. A few small lights on the upper puffs only, biased to the sun
        // side. Light lives on top; the base stays in shadow.
        const tops = puffs.slice().sort((a, b) => a.dy - b.dy).slice(0, 3);
        for (const p of tops) {
          const px = x + (p.dx - 0.08) * size, py = y + (p.dy - 0.08) * size;
          const pr = p.r * size * 0.8;
          const g = c.createRadialGradient(px, py, 0, px, py, pr);
          g.addColorStop(0, css(look.core, 0.9));
          g.addColorStop(1, css(look.core, 0));
          c.fillStyle = g;
          c.beginPath(); c.arc(px, py, pr, 0, Math.PI * 2); c.fill();
        }
        if (look.rain && x > -100 && x < W + 100) {
          c.strokeStyle = 'rgba(120,140,160,0.55)';
          c.lineWidth = 1.5;
          for (let k = 0; k < 4; k++) {
            const rx = x - size * 0.4 + k * size * 0.27;
            const ry = y + size * 0.38;
            c.beginPath(); c.moveTo(rx, ry); c.lineTo(rx - 5, ry + 15); c.stroke();
          }
        }
        c.restore();
      }

      // Night disc + glow in its own slot. Rendered before the cloud
      // loop so weather passes in front.
      function drawMoon(c, alpha) {
        if (alpha < 0.02) return;
        const x = LANDSCAPE_MOON.x * W, y = LANDSCAPE_MOON.y * H;
        const r = Math.min(W, H) * 0.038;
        c.save();
        c.globalAlpha = alpha;
        const glow = c.createRadialGradient(x, y, 0, x, y, r * 3);
        glow.addColorStop(0, 'rgba(220,228,245,0.5)');
        glow.addColorStop(1, 'rgba(220,228,245,0)');
        c.fillStyle = glow;
        c.beginPath(); c.arc(x, y, r * 3, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#e8ecf4';
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(160,170,190,0.6)';
        c.beginPath(); c.arc(x - r * 0.3, y - r * 0.2, r * 0.18, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(x + r * 0.25, y + r * 0.3, r * 0.13, 0, Math.PI * 2); c.fill();
        c.restore();
      }

      // Seeded static star field, faded in by night factor (alpha boosted
      // to survive the night wash applied later).
      const STARS = [];
      for (let i = 0; i < 90; i++) {
        STARS.push({ x: pseudoRandom(i * 2.17), y: pseudoRandom(i * 5.71) * 0.62, r: 0.6 + pseudoRandom(i * 8.3) * 1.3 });
      }
      function drawStars(c, alpha, time) {
        if (alpha < 0.02) return;
        c.save();
        c.fillStyle = '#ffffff';
        for (const s of STARS) {
          const tw = 0.55 + 0.45 * Math.sin(time * 1.7 + s.x * 40);
          c.globalAlpha = alpha * tw;
          c.beginPath(); c.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); c.fill();
        }
        c.restore();
      }

      // Extra window glow after the night tint so the cabin stays cozy.
      function drawWindowBoost(c, windows, alpha) {
        if (!windows || alpha < 0.02) return;
        c.save();
        for (const r of windows) {
          const g = c.createRadialGradient(
            r.x + r.w / 2, r.y + r.h / 2, 0, r.x + r.w / 2, r.y + r.h / 2, r.w * 1.6
          );
          g.addColorStop(0, 'rgba(255,205,110,' + (0.55 * alpha).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,180,80,0)');
          c.fillStyle = g;
          c.fillRect(r.x - r.w, r.y - r.h, r.w * 3, r.h * 3);
        }
        c.restore();
      }

      function drawSun(c, alpha) {
        if (alpha < 0.02) return;
        const x = sunPos.x * W, y = sunPos.y * H;
        const r = Math.min(W, H) * 0.055;

        c.save();
        c.globalAlpha = alpha;
        const glow = c.createRadialGradient(x, y, 0, x, y, r * 3.2);
        glow.addColorStop(0, 'rgba(246,198,91,.55)');
        glow.addColorStop(1, 'rgba(246,198,91,0)');
        c.fillStyle = glow;
        c.beginPath();
        c.arc(x, y, r * 3.2, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#f6c65b';
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }

      function render(time) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(backdropCanvas, 0, 0, W, H);

        // Daylight state from the browser clock (always live, like auto).
        const blend = dayBlendForDate(new Date());
        const nightF = 1 - blend.day;
        const prog = updateSunPos(blend.h, blend.rise, blend.set);
        const sunAlpha = clamp(blend.day + blend.dusk * 0.6, 0, 1);
        drawSun(ctx, sunAlpha);

        // Moon and stars live in the sky, behind the clouds.
        drawMoon(ctx, nightF);
        drawStars(ctx, Math.min(1, nightF * (1 - blend.dusk * 0.4) * 1.6), time);

        // Long soft shadows away from a low sun; warm rim at dusk.
        const shadeA = clamp(1 - Math.sin(Math.PI * clamp(prog, 0, 1)), 0, 1) *
          clamp(blend.day + blend.dusk, 0, 1);
        const shade = { dx: (0.5 - prog) * 1.6, alpha: shadeA };
        const rim = blend.dusk;

        // Timeline clouds: pinned to snapshot age, each wearing its own
        // immutable metric. Downsample oldest-first, always keep latest.
        // History never rewrites on range change — only the visible set does.
        const now = Date.now();
        if (rawData && rawData.rows && rawData.rows.length > 0) {
          const cutoff = now - state.activeRangeHours * 3600000;
          let vis = [];
          for (let i = 0; i < rawData.rows.length; i++) {
            if (snapshotTimes[i] >= cutoff) vis.push(i);
          }
          if (vis.length > LANDSCAPE_CLOUD_CAP) {
            const picked = [];
            for (let k = 0; k < LANDSCAPE_CLOUD_CAP - 1; k++) {
              picked.push(vis[Math.round(k * (vis.length - 1) / (LANDSCAPE_CLOUD_CAP - 2))]);
            }
            picked.push(vis[vis.length - 1]);
            vis = picked;
          }

          for (let k = 0; k < vis.length; k++) {
            const i = vis[k];
            const x = getCloudPosition(snapshotTimes[i], now);
            if (x > -160 && x < W + 160) {
              // Seed from the snapshot timestamp: stable across data changes.
              const seed = snapshotTimes[i];
              const y = H * (0.10 + pseudoRandom(seed) * 0.24);
              const look = cloudLook(metricSeries[i]);
              const size = 64 * look.sizeMul * (W / 1400 + 0.6);
              drawCloud(ctx, x, y, size, seed, look);
            }
          }
        }

        ctx.drawImage(foregroundCanvas, 0, 0, W, H);
        drawPinesGround(shade, rim);
        const cabinInfo = drawCabinGround(shade, rim);
        drawFireBaseGround();

        // Foreground silhouette grade: ground and trees go darker while
        // the sky stays bright.
        const groundTop = H * LANDSCAPE_GROUND_TOP;
        const gradeA = clamp((1 - blend.day) * 0.85, 0, 0.55);
        if (gradeA > 0.01) {
          const fg = ctx.createLinearGradient(0, groundTop - 40, 0, H);
          fg.addColorStop(0, 'rgba(16,14,38,0)');
          fg.addColorStop(1, 'rgba(16,14,38,' + gradeA.toFixed(3) + ')');
          ctx.fillStyle = fg;
          ctx.fillRect(0, groundTop - 40, W, H - groundTop + 40);
        }

        // Daylight washes; flames/glow (stage 4) punch through undimmed.
        if (blend.dusk > 0.01) {
          ctx.fillStyle = 'rgba(255,130,50,' + (0.30 * blend.dusk).toFixed(3) + ')';
          ctx.fillRect(0, 0, W, H);
        }
        if (nightF > 0.01) {
          ctx.fillStyle = 'rgba(8,16,52,' + (0.62 * nightF).toFixed(3) + ')';
          ctx.fillRect(0, 0, W, H);
        }
        drawWindowBoost(ctx, cabinInfo.windows, nightF);
      }

      function frame(ts) {
        rafRunning = true;
        if (lastFrameTs === null) lastFrameTs = ts;
        const dt = Math.min(LANDSCAPE_MAX_FRAME_DT, (ts - lastFrameTs) / 1000);
        lastFrameTs = ts;

        updateTransition(dt);
        // Transitions run capped at 30fps: plenty for a 0.75s color morph.
        if (ts - lastPaintTs >= LANDSCAPE_FRAME_MIN_MS) {
          lastPaintTs = ts;
          render(ts / 1000);
        }

        if (state.transitionProgress < 1.0) {
          requestAnimationFrame(frame);
        } else {
          rafRunning = false;
          render(ts / 1000); // exact final state, even if throttled
        }
      }

      /**
       * Positions the fire overlay canvas over the campfire spot.
       * Called on init and resize; the overlay itself stays fixed-size.
       */
      function layoutFireOverlay() {
        if (!fireCanvas) return;
        const fx = LANDSCAPE_FIRE.x * W, fy = H * LANDSCAPE_GROUND_TOP + 26;
        fireCanvas.width = LANDSCAPE_FIRE_OVERLAY_W;
        fireCanvas.height = LANDSCAPE_FIRE_OVERLAY_H;
        fireCanvas.style.width = LANDSCAPE_FIRE_OVERLAY_W + 'px';
        fireCanvas.style.height = LANDSCAPE_FIRE_OVERLAY_H + 'px';
        fireCanvas.style.left = Math.round(fx - LANDSCAPE_FIRE_OVERLAY_W / 2) + 'px';
        fireCanvas.style.top = Math.round(fy - (LANDSCAPE_FIRE_OVERLAY_H - LANDSCAPE_FIRE_ANCHOR_DY)) + 'px';
      }

      /**
       * Paints one deterministic fire frame (no accumulated particle state,
       * so any frame rate looks correct). Local coords: fire base at (0, 0).
       */
      function paintFireOverlay(ts) {
        if (!fireCtx) return;
        const now = ts / 1000;
        const blend = dayBlendForDate(new Date());
        const nightF = 1 - blend.day;
        const intensity = 0.55 * (1 + nightF * 0.5);
        const flicker = 0.82 + 0.12 * Math.sin(now * 11) + 0.06 * Math.sin(now * 23 + 1.7);
        const c = fireCtx, s = LANDSCAPE_FIRE.s;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, LANDSCAPE_FIRE_OVERLAY_W, LANDSCAPE_FIRE_OVERLAY_H);
        c.save();
        c.translate(LANDSCAPE_FIRE_OVERLAY_W / 2, LANDSCAPE_FIRE_OVERLAY_H - LANDSCAPE_FIRE_ANCHOR_DY);
        c.scale(s, s);

        // Ground glow (behind flames).
        const gr = (60 + intensity * 90) * flicker;
        const glow = c.createRadialGradient(0, -10, 0, 0, -10, gr);
        glow.addColorStop(0, 'rgba(255,190,90,' + (0.35 + intensity * 0.3).toFixed(3) + ')');
        glow.addColorStop(1, 'rgba(255,150,60,0)');
        c.fillStyle = glow;
        c.beginPath(); c.arc(0, -10, gr, 0, Math.PI * 2); c.fill();

        // Flames, additive.
        c.globalCompositeOperation = 'lighter';
        for (let i = 0; i < LANDSCAPE_FIRE_FLAMES; i++) {
          const age = (((now * 1.4 + i * 0.37) % 1) + 1) % 1;
          const x = Math.sin(i * 7.3 + age * 5) * 10 * age;
          const y = -6 - age * 62;
          const r = Math.max(0.1, (7 + ((i * 3.7) % 9)) * (1 - age * 0.75) * flicker);
          const g = c.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(255,236,150,' + (0.9 * (1 - age)).toFixed(3) + ')');
          g.addColorStop(0.5, 'rgba(255,150,50,' + (0.55 * (1 - age)).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(200,60,20,0)');
          c.fillStyle = g;
          c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
        }
        // Sparks.
        c.fillStyle = '#ffdf8a';
        for (let i = 0; i < LANDSCAPE_FIRE_SPARKS; i++) {
          const age = (((now * 1.8 + i * 0.53) % 1) + 1) % 1;
          const x = Math.sin(i * 5.1 + age * 9) * 20 * age;
          const y = -10 - age * 110;
          c.globalAlpha = 1 - age;
          c.fillRect(x, y, 2, 2);
        }
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'source-over';
        // Smoke drifts up front (normal composite, dimmed by night already
        // present in the main scene behind it).
        c.fillStyle = '#cfd4d6';
        for (let k = 0; k < 4; k++) {
          const age = (((now + k * 1.35) % 5.4) + 5.4) % 5.4 / 5.4;
          const px = Math.sin(now / 0.9 + k * 2.1) * 4 + age * 26;
          const py = -46 - age * 64;
          c.globalAlpha = 0.22 * (1 - age);
          c.beginPath(); c.arc(px, py, 4 + age * 11, 0, Math.PI * 2); c.fill();
        }
        c.globalAlpha = 1;
        c.restore();
      }

      function fireLoop(ts) {
        if (!fireRunning) return;
        if (ts - fireLastPaint >= 1000 / LANDSCAPE_FIRE_FPS) {
          fireLastPaint = ts;
          paintFireOverlay(ts);
        }
        requestAnimationFrame(fireLoop);
      }

      function startFireOverlay() {
        if (!fireCanvas) {
          fireCanvas = document.getElementById('trajectoryFire');
          if (!fireCanvas) return; // graceful no-op if canvas absent
          fireCtx = fireCanvas.getContext('2d');
        }
        layoutFireOverlay();
        if (REDUCED_MOTION) {
          paintFireOverlay(1000); // single static frame, no loop
          return;
        }
        if (!fireRunning) {
          fireRunning = true;
          requestAnimationFrame(fireLoop);
        }
      }

      /**
       * Hands rendering back to full-rate rAF for a transition.
       */
      function kickTransitionLoop() {
        if (!rafRunning) requestAnimationFrame(frame);
      }

      /**
       * Paints a single frame on demand (data load, range change, resize).
       * Idle costs nothing: with no transition running this renders once
       * and stops instead of looping.
       */
      function requestRender() {
        kickTransitionLoop();
      }

      function init() {
        canvas = document.getElementById('trajectoryWeather');
        if (!canvas) return; // graceful no-op if canvas absent
        ctx = canvas.getContext('2d');

        backdropCanvas = document.createElement('canvas');
        backdropCtx = backdropCanvas.getContext('2d');
        foregroundCanvas = document.createElement('canvas');
        foregroundCtx = foregroundCanvas.getContext('2d');

        window.addEventListener('resize', resize);
        resize();

        if (!started) {
          started = true;
          render(Date.now() / 1000);
          startFireOverlay();
          // Slow daylight/cloud-age refresh: one frame per minute keeps the
          // time-of-day blend fresh with negligible cost.
          setInterval(() => {
            if (!document.hidden) requestRender();
          }, LANDSCAPE_SLOW_REFRESH_MS);
        }
      }

      return {
        init: init,
        setTargetMetric: setTargetMetric,
        setActiveRangeDays: setActiveRangeDays,
        ingestSnapshots: ingestSnapshots,
        requestRender: requestRender
      };
    })();


    /**
     * Initializes Google Charts, notifications container, and fetches dashboard metrics.
     */
    function init() {
      initNotifications();
      initAdminLink();
      setupEventWiring();
      const sheetBtn = document.getElementById('sheetLink');
      if (sheetBtn) {
        sheetBtn.addEventListener('click', () => openLinkButtonUrl('sheetLink'));
      }
      Landscape.init();
      google.charts.load('current', { packages: ['corechart'] });
      google.charts.setOnLoadCallback(fetchData);
      setupResizeHandler();
      setupStalenessUpdateTimer();
      setupAutoFetch();
      setupPageVisibilityHandler();
      if (autoFetchEnabled) {
        startAutoFetch();
      }
    }

    /**
     * Wires all dashboard controls to their handlers (replaces inline on* attributes).
     */
    function setupEventWiring() {
      const on = (id, event, handler) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener(event, handler);
      };

      on('btnSyncNow', 'click', handleSyncNow);
      on('btnReloadData', 'click', handleReloadData);
      on('btnDeleteOldCompleted', 'click', handleDeleteOldCompletedTasks);
      on('btnDownsampleLastYear', 'click', handleDownsampleLastYear);
      on('btnPruneOldData', 'click', handlePruneOldData);
      on('toggleAutoTrigger', 'change', (e) => handleTriggerToggle(e.target.checked));

      ['toggleOpen', 'toggleOverdue', 'toggleCompleted', 'toggleSeverity', 'toggleRollingAvg']
        .forEach((id) => on(id, 'change', updateChartVisibility));

      const rangeGroup = document.getElementById('rangeFilterGroup');
      if (rangeGroup) {
        rangeGroup.addEventListener('click', (e) => {
          const pill = e.target.closest('.pill');
          if (!pill) return;
          const raw = pill.getAttribute('data-range');
          setRangeFilter(raw === 'all' ? 'all' : Number(raw));
        });
      }
    }

    /**
     * Debounced window resize event listener.
     */
    function setupResizeHandler() {
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (rawData) renderCharts();
        }, RESIZE_DEBOUNCE_MS);
      });
    }

    /**
     * Opens the runtime URL stored on a link button in a new tab (no-op until set).
     * @param {string} elementId
     */
    function openLinkButtonUrl(elementId) {
      const btn = document.getElementById(elementId);
      if (btn && btn.dataset.url) {
        window.open(btn.dataset.url, '_blank', 'noopener');
      }
    }

    /**
     * Initializes the admin link button with the script project ID.
     */
    function initAdminLink() {
      const adminBtn = document.getElementById('btnAdmin');
      if (adminBtn) {
        adminBtn.addEventListener('click', () => openLinkButtonUrl('btnAdmin'));
      }
      google.script.run.withSuccessHandler((scriptId) => {
        if (adminBtn && scriptId) {
          adminBtn.dataset.url = 'https://script.google.com/home/projects/' + scriptId + '/edit';
        }
      }).getScriptProjectId();
    }

    /**
     * Sets up timer to update relative age ("xx ago") every 10 seconds without fetching data.
     */
    function setupStalenessUpdateTimer() {
      stalenessUpdateTimer = setInterval(() => {
        if (lastSnapshotTime) {
          updateStalenessDisplay();
        }
      }, STALENESS_UPDATE_INTERVAL_MS);
    }

    /**
     * Sets up auto-fetch background polling to refresh sheet data periodically.
     */
    function setupAutoFetch() {
      // Check if toggle exists and is enabled
      const autoFetchCheckbox = document.getElementById('toggleAutoFetch');
      if (autoFetchCheckbox) {
        autoFetchCheckbox.addEventListener('change', (e) => {
          autoFetchEnabled = e.target.checked;
          if (autoFetchEnabled) {
            startAutoFetch();
          } else {
            stopAutoFetch();
          }
        });
      }

      // Check if interval selector exists
      const intervalSelect = document.getElementById('autoFetchInterval');
      if (intervalSelect) {
        intervalSelect.addEventListener('change', (e) => {
          autoFetchIntervalMs = Number(e.target.value) * 60 * 1000; // Convert minutes to ms (constant)
          // Restart timer with new interval if enabled
          if (autoFetchEnabled) {
            stopAutoFetch();
            startAutoFetch();
          }
        });
      }
    }

    /**
     * Starts the background auto-fetch timer.
     */
    function startAutoFetch() {
      if (autoFetchTimer) return; // Already running
      autoFetchTimer = setInterval(performAutoFetch, autoFetchIntervalMs);
    }

    /**
     * Stops the background auto-fetch timer.
     */
    function stopAutoFetch() {
      if (autoFetchTimer) {
        clearInterval(autoFetchTimer);
        autoFetchTimer = null;
      }
    }

    /**
     * Performs a background data refresh from sheet (no Tasks API call).
     */
    function performAutoFetch() {
      // Silently fetch data; only show errors
      google.script.run
        .withSuccessHandler((data) => {
          lastAutoFetchTime = Date.now();
          onDataLoaded(data);
        })
        .withFailureHandler((error) => {
          console.error('Auto-fetch error:', error);
        })
        .getDashboardData();
    }

    /**
     * Sets up Page Visibility API to pause/resume auto-fetch when tab is hidden/visible.
     * On focus regain, fetches immediately if the timer expired during sleep.
     */
    function setupPageVisibilityHandler() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Tab is hidden: pause auto-fetch timer
          if (autoFetchEnabled) {
            stopAutoFetch();
          }
        } else {
          // Tab is visible: check if fetch is overdue, then restart timer
          if (autoFetchEnabled) {
            const timeSinceLastFetch = Date.now() - lastAutoFetchTime;
            if (timeSinceLastFetch >= autoFetchIntervalMs) {
              // Fetch immediately since timer expired
              performAutoFetch();
            }
            // (Re)start timer for future fetches
            startAutoFetch();
          }
        }
      });
    }

    /**
     * Initializes dynamic notification container in DOM.
     */
    function initNotifications() {
      if (!document.getElementById('notificationContainer')) {
        const container = document.createElement('div');
        container.id = 'notificationContainer';
        container.className = 'notification-container';
        document.body.appendChild(container);
      }
    }

    /**
     * Displays a compact notification bubble with auto-dismiss.
     * @param {string} message - Text content (supports newlines)
     * @param {string} icon - Emoji icon
     * @param {string} type - 'success' | 'error' | 'info'
     * @param {number} durationMs - Auto-dismiss timeout (ms)
     */
    function showNotification(message, icon, type = 'info', durationMs = 3000) {
      initNotifications();
      const container = document.getElementById('notificationContainer');
      if (!container) return;

      const bubble = document.createElement('div');
      bubble.className = 'notification-bubble ' + type;
      bubble.innerHTML = `
        <span class="notification-icon">${icon}</span>
        <span class="notification-text">${message}</span>
        <button class="notification-dismiss" title="Dismiss">×</button>
      `;

      const dismissBtn = bubble.querySelector('.notification-dismiss');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          bubble.classList.add('dismissing');
          setTimeout(() => bubble.remove(), NOTIFICATION_ANIMATION_MS);
        });
      }

      container.appendChild(bubble);

      // Keep max 3 bubbles visible at once
      while (container.children.length > 3) {
        container.removeChild(container.firstChild);
      }

      if (durationMs > 0) {
        setTimeout(() => {
          if (bubble.parentElement) {
            bubble.classList.add('dismissing');
            setTimeout(() => bubble.remove(), NOTIFICATION_ANIMATION_MS);
          }
        }, durationMs);
      }
    }

    /**
     * Fetches historical time-series data from backend RPC.
     */
    function fetchData() {
      showStatus('Loading data from Google Sheet...', 'info');
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .getDashboardData();
    }

    /**
     * Formats a compact description of a value for diagnostics.
     * @param {*} value
     * @return {string}
     */
    function describeValue(value) {
      if (value === null) return 'null';
      if (value === undefined) return 'undefined';
      if (Array.isArray(value)) return 'Array(' + value.length + ')';
      return typeof value;
    }

    /**
     * Handles successful data reception from Apps Script.
     * @param {Object} data - { headers, rows, sheetUrl, triggerActive }
     */
    function onDataLoaded(data) {
      if (!data || typeof data !== 'object' || Array.isArray(data)) {
        const details = [
          'Expected: object with rows: Array',
          'Received: ' + describeValue(data)
        ];

        console.error('Invalid dashboard data received from server.', {
          data: data,
          receivedType: describeValue(data)
        });

        showStatus(
          'Invalid server response. ' + details.join(' | ') + '.',
          'error'
        );
        return;
      }

      if (!Array.isArray(data.rows)) {
        const keys = Object.keys(data);
        const rowDetails = data.rows === undefined
          ? 'missing'
          : describeValue(data.rows);
        const fields = keys.length > 0 ? keys.join(', ') : '(none)';

        console.error('Invalid dashboard data received from server.', {
          data: data,
          keys: keys,
          rows: data.rows,
          rowsType: typeof data.rows,
          rowsIsArray: Array.isArray(data.rows)
        });

        showStatus(
          'Invalid server response. Expected rows: Array; ' +
          'received rows: ' + rowDetails + '. Fields: ' + fields + '.',
          'error'
        );
        return;
      }

      console.debug('Dashboard data received successfully.', {
        keys: Object.keys(data),
        rowCount: data.rows.length,
        firstRow: data.rows.length > 0 ? data.rows[0] : null,
        lastRow: data.rows.length > 0
          ? data.rows[data.rows.length - 1]
          : null,
        sheetUrlPresent: Boolean(data.sheetUrl),
        triggerActive: data.triggerActive
      });

      rawData = JSON.parse(JSON.stringify(data));
      hideStatus();

      // Precompute per-snapshot timeline metrics once per data load.
      Landscape.ingestSnapshots(rawData.rows || []);

      // Set sheet-fetch timestamp on every successful data load
      lastSheetFetchTime = Date.now();

      if (data.sheetUrl) {
        const link = document.getElementById('sheetLink');
        if (link) link.dataset.url = data.sheetUrl;
      }

      const triggerBox = document.getElementById('toggleAutoTrigger');
      if (triggerBox) {
        triggerBox.checked = (typeof data.triggerActive === 'boolean') ? data.triggerActive : true;
      }

      updateKPIsAndStaleness();
      renderCharts();
      renderTopOverdueTasks(data.topOverdueTasksTopX || []);

      Landscape.setActiveRangeDays(activeRangeDays);
      Landscape.setTargetMetric(calculateMetricForRange(rawData.rows, activeRangeDays === 'all' ? LANDSCAPE_ALL_RANGE_WINDOW_DAYS : activeRangeDays));
      Landscape.requestRender(); // repaint for new data even without a transition
    }

    /**
     * Handles data load or sync errors with descriptive messages.
     * @param {Error|Object|string} err
     */
    function onDataError(err) {
      const msg = (err && (err.message || err.toString())) || 'Unknown server error';
      showStatus('Operation failed: ' + msg, 'error');
      showNotification(`Error\n${msg}`, '❌', 'error', NOTIFICATION_ERROR_DURATION_MS);
    }

    /**
     * Updates top KPI cards and staleness indicator. Stores snapshot time for relative age updates.
     */
    function updateKPIsAndStaleness() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;

      const rows = rawData.rows;
      const latest = rows[rows.length - 1];

      const totalOpen = typeof latest[1] === 'number' ? latest[1] : 0;
      const completed = typeof latest[2] === 'number' ? latest[2] : 0;
      const overdue = typeof latest[3] === 'number' ? latest[3] : 0;
      const severity = typeof latest[4] === 'number' ? latest[4] : 0;
      const onTime = Math.max(0, totalOpen - overdue);

      setElemText('kpiOpen', totalOpen);
      setElemText('kpiOpenSubtext', onTime + ' on-time + ' + overdue + ' overdue');
      setElemText('kpiCompleted', completed);
      setElemText('kpiOverdue', overdue);
      setElemText('kpiSeverity', severity.toFixed(1));

      const lastDate = new Date(latest[0]);
      if (!isNaN(lastDate.getTime())) {
        lastSnapshotTime = lastDate.getTime();
        updateStalenessDisplay();
      }

      calculateVelocity(rows);
      updateBacklogEstimate(rows);
    }

    /**
     * Updates the relative age display ("xx min ago") without fetching data.
     * Called every 10 seconds by timer, and immediately after data fetch.
     */
    function updateStalenessDisplay() {
      if (lastSnapshotTime) {
        const diffMins = Math.floor((Date.now() - lastSnapshotTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSnapshotTime);

        setElemText('lastSnapshotAge',
          'Last snapshot: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
      }

      if (lastSheetFetchTime) {
        const diffMins = Math.floor((Date.now() - lastSheetFetchTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSheetFetchTime);
        
        const elem = document.getElementById('lastSheetFetchAge');
        if (elem) {
          elem.classList.remove('hidden');
          setElemText('lastSheetFetchAge',
            'Last sheet fetch: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
        }
      }
    }

    /**
     * Formats relative time string for display.
     * @param {number} minutes - Minutes elapsed
     * @return {string}
     */
    function formatTimeAgo(minutes) {
      if (minutes < 1) return 'Just now';
      if (minutes < 60) return Math.floor(minutes) + ' min ago';
      const hours = minutes / 60;
      if (hours < 24) return hours.toFixed(1) + ' hr ago';
      return Math.floor(hours / 24) + ' day' + (hours >= 48 ? 's' : '') + ' ago';
    }

    /**
     * Calculates task addition rate over the selected historical window.
     * Addition rate = (open_start - open_end + completed_in_period) / days_elapsed
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks added per day
     */
    /**
     * Filters rows to a time window without modifying the original array.
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Range (3, 7, 14, 30, or 'all')
     * @return {Array<Array<any>>} - Filtered rows in the window
     */
    function getWindowRows(rows, rangeDays) {
      if (!rows) return [];

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * MS_PER_DAY);

      return rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });
    }

    /**
     * Calculates total tasks added in a window using addition formula.
     * @param {Array<Array<any>>} windowRows - Rows filtered to the window
     * @return {number} - Tasks added in the period
     */
    function calculateTasksAdded(windowRows) {
      if (!windowRows || windowRows.length < 2) return 0;

      const oldestOpen = typeof windowRows[0][1] === 'number' ? windowRows[0][1] : 0;
      const newestOpen = typeof windowRows[windowRows.length - 1][1] === 'number' ? windowRows[windowRows.length - 1][1] : 0;
      const completedInPeriod = calculateCompletionsInWindow(windowRows);

      // Tasks added = (open_start - open_end + completed)
      return Math.max(0, oldestOpen - newestOpen + completedInPeriod);
    }

    function calculateAdditionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const windowRows = getWindowRows(rows, rangeDays);
      if (windowRows.length < 2) return 0;

      const tasksAdded = calculateTasksAdded(windowRows);
      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;

      return tasksAdded / elapsedDays;
    }

    /**
     * Sums positive completion deltas in a window (ignores purges/deletes).
     * @param {Array<Array<any>>} windowRows - Snapshot rows in the window
     * @return {number} - Total completions
     */
    function calculateCompletionsInWindow(windowRows) {
      let total = 0;
      for (let i = 1; i < windowRows.length; i++) {
        const delta = windowRows[i][2] - windowRows[i - 1][2];
        if (delta > 0) total += delta;
      }
      return total;
    }

    /**
     * Calculates completion rate over the selected historical window.
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks completed per day
     */
    function calculateCompletionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * MS_PER_DAY);

      const windowRows = rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });

      if (windowRows.length < 2) return 0;

      const completions = calculateCompletionsInWindow(windowRows);
      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;

      return completions / elapsedDays;
    }

    /**
     * Calculates estimated days to backlog completion.
     * @param {number} currentOpen - Current open task count
     * @param {number} completionRate - Tasks completed per day
     * @param {number} additionRate - Tasks added per day
     * @return {string|number} - Days to completion, "Cannot estimate", or "∞"
     */
    function calculateDaysToCompletion(currentOpen, completionRate, additionRate) {
      if (currentOpen <= 0) return '0';
      if (completionRate <= additionRate) return 'Cannot estimate';

      const netRate = completionRate - additionRate;
      const days = currentOpen / netRate;
      if (!isFinite(days) || days < 0) return 'Cannot estimate';

      // Return as integer if >= 1 day, else 1 decimal place
      if (days >= 1) return Math.round(days).toString();
      return days.toFixed(1);
    }

    /**
     * Determines status class based on ETA days.
     * @param {number} days - Estimated days to completion
     * @return {string} - 'status-good', 'status-caution', or 'status-warning'
     */
    function getETAStatusClass(days) {
      if (typeof days !== 'number' || !isFinite(days)) return '';
      if (days <= ETA_THRESHOLD_GOOD) return 'status-good';
      if (days <= ETA_THRESHOLD_CAUTION) return 'status-caution';
      return 'status-warning';
    }

    /**
     * Updates backlog completion estimate in the UI.
     * Called from updateKPIsAndStaleness after calculating completion rate.
     */
    function updateBacklogEstimate(rows) {
      const estCard = document.getElementById('backlogEstimateCard');
      if (!estCard) return;

      if (!rows || rows.length === 0) {
        estCard.classList.add('hidden');
        return;
      }

      const currentOpen = typeof rows[rows.length - 1][1] === 'number' ? rows[rows.length - 1][1] : 0;
      const completionRate = calculateCompletionRate(rows, activeRangeDays);
      const additionRate = calculateAdditionRate(rows, activeRangeDays);
      const estimate = calculateDaysToCompletion(currentOpen, completionRate, additionRate);

      // Show card unless backlog is zero
      if (estimate === '0') {
        estCard.classList.add('hidden');
      } else {
        estCard.classList.remove('hidden');
        const label = document.getElementById('backlogEstimateValue');
        const note = document.getElementById('backlogEstimateNote');
        const counts = document.getElementById('backlogCountsNote');
        
        if (label) {
          label.textContent = estimate;
          // Use a smaller font for text-based values so they fit on one line
          label.classList.toggle('value-compact', isNaN(Number(estimate)));
          
          // Apply status coloring based on numeric ETA
          const numDays = parseFloat(estimate);
          const statusClass = getETAStatusClass(numDays);
          label.className = 'value ' + statusClass;
          estCard.className = 'card card-purple ' + statusClass;
        }
        
        if (note) {
          if (estimate === 'Cannot estimate') {
            note.textContent = 'Adding ~' + additionRate.toFixed(1) + '/day vs completing ~' + completionRate.toFixed(1) + '/day';
          } else {
            const rangeLabel = activeRangeDays === 'all' ? 'all time' : activeRangeDays + ' days';
            note.textContent = 'Based on rates over past ' + rangeLabel;
          }
        }
        
        // Display raw counts only when completion rate > addition rate and open > 0
        if (counts && completionRate > additionRate && currentOpen > 0) {
          const windowRows = getWindowRows(rows, activeRangeDays);
          const tasksAdded = calculateTasksAdded(windowRows);
          const tasksCompleted = calculateCompletionsInWindow(windowRows);
          counts.textContent = tasksAdded + ' added / ' + tasksCompleted + ' completed this period';
          counts.classList.remove('hidden');
        } else if (counts) {
          counts.classList.add('hidden');
        }
      }
    }

    /**
     * Computes the trajectory-weather metric for a given display range, using a
     * fixed 14-day baseline (or all available history if shorter) as the stable
     * reference point. Only the "recent" window scales with the selected range;
     * the baseline never does. See landscape-extension-design-brief.md section 2.
     * @param {Array<Array<any>>} rows - Snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} rangeDays - Active display range in days (30 substituted for 'all')
     * @return {number} - Metric in [0, 1], where 0.5 is neutral/steady
     */
    function calculateMetricForRange(rows, rangeDays) {
      if (!rows || rows.length < 2) return LANDSCAPE_METRIC_NEUTRAL;

      const now = Date.now();

      // Determine baseline window: 14 days, or all available history if shorter.
      const earliestTime = new Date(rows[0][0]).getTime();
      const availableHistoryDays = (now - earliestTime) / MS_PER_DAY;
      const baselineWindowDays = Math.min(LANDSCAPE_BASELINE_WINDOW_DAYS, Math.max(1, availableHistoryDays));

      const sumPositiveDeltas = (windowDays) => {
        const cutoff = now - windowDays * MS_PER_DAY;
        const windowRows = rows.filter(r => new Date(r[0]).getTime() >= cutoff);
        if (windowRows.length < 2) return { total: 0, elapsedDays: 0 };

        let total = 0;
        for (let i = 1; i < windowRows.length; i++) {
          const delta = windowRows[i][2] - windowRows[i - 1][2];
          if (delta > 0) total += delta;
        }
        const oldest = new Date(windowRows[0][0]).getTime();
        const newest = new Date(windowRows[windowRows.length - 1][0]).getTime();
        const elapsedDays = Math.max(1, newest - oldest) / MS_PER_DAY;
        return { total: total, elapsedDays: elapsedDays };
      };

      const baseline = sumPositiveDeltas(baselineWindowDays);
      const recent = sumPositiveDeltas(rangeDays);

      if (baseline.total <= 0 || baseline.elapsedDays <= 0) {
        return LANDSCAPE_METRIC_NEUTRAL;
      }

      const velocityBaseline = baseline.total / baseline.elapsedDays;
      const velocityRecent = recent.total / recent.elapsedDays;

      if (velocityBaseline <= 0) return LANDSCAPE_METRIC_NEUTRAL;

      const trendRatio = velocityRecent / velocityBaseline;
      const metric = (trendRatio - LANDSCAPE_TREND_CENTER) / LANDSCAPE_TREND_SCALE;
      return Math.max(0, Math.min(1, metric));
    }

    /**
     * Calculates completion throughput velocity over 3 time windows.
     * Sums only positive increments between snapshots to survive purges/deletes.
     * @param {Array<Array<any>>} rows
     */
    function calculateVelocity(rows) {
      const calculate = (days) => {
        const cutoff = Date.now() - days * MS_PER_DAY;
        const recentRows = rows.filter(r =>
          new Date(r[0]).getTime() >= cutoff
        );

        if (recentRows.length < 2) return { value: '-', status: '' };

        let totalCompletions = 0;
        for (let i = 1; i < recentRows.length; i++) {
          const delta = recentRows[i][2] - recentRows[i - 1][2];
          if (delta > 0) totalCompletions += delta;
        }

        const oldestTime = new Date(recentRows[0][0]).getTime();
        const newestTime = new Date(recentRows[recentRows.length - 1][0]).getTime();
        const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;
        const velocity = totalCompletions / elapsedDays;
        
        // Calculate implied ETA based on current open and velocity
        const currentOpen = typeof recentRows[recentRows.length - 1][1] === 'number' ? recentRows[recentRows.length - 1][1] : 0;
        const impliedETA = velocity > 0 ? currentOpen / velocity : Infinity;
        
        return {
          value: velocity.toFixed(1),
          status: getETAStatusClass(impliedETA)
        };
      };

      const vel1d = calculate(VELOCITY_WINDOW_1D);
      const vel3d = calculate(VELOCITY_WINDOW_3D);
      const vel7d = calculate(VELOCITY_WINDOW_7D);

      const velocitySubtext = document.getElementById('kpiVelocitySubtext');
      if (velocitySubtext) {
        velocitySubtext.innerHTML =
          '<span class="' + vel1d.status + '">24h: ' + vel1d.value + '</span>' +
          ' \u00a0 <span class="' + vel3d.status + '">3d: ' + vel3d.value + '</span>' +
          ' \u00a0 <span class="' + vel7d.status + '">7d: ' + vel7d.value + '</span> /day';
      }
    }

    /**
     * Re-renders the primary chart.
     */
    function renderCharts() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;
      drawStackedLineComboChart();
    }

    /**
     * Helper to safely read checkbox state with DOM null guard.
     */
    function isChecked(elemId) {
      const el = document.getElementById(elemId);
      return el ? Boolean(el.checked) : false;
    }

    /**
     * Safe DOM text updater with null guard.
     */
    function setElemText(elemId, text) {
      const el = document.getElementById(elemId);
      if (el) el.textContent = text;
    }

    /**
     * Retrieves local timezone label.
     */
    function getLocalTimezoneLabel() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      } catch (e) {
        return 'Local';
      }
    }

    /**
     * Downsamples data to reduce rendered points while preserving trend.
     * Uses binning: groups consecutive rows into buckets and keeps the latest in each bucket.
     * @param {Array<Array<any>>} rows - Array of snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} targetBuckets - Target number of buckets (default 50)
     * @returns {Array<Array<any>>} - Downsampled rows
     */
    function downsampleData(rows, targetBuckets = DOWNSAMPLE_TARGET_BUCKETS) {
      if (rows.length <= targetBuckets) return rows;

      const bucketSize = Math.ceil(rows.length / targetBuckets);
      const downsampled = [];

      for (let i = 0; i < rows.length; i += bucketSize) {
        const bucket = rows.slice(i, i + bucketSize);
        // Keep the latest (last) row in each bucket
        downsampled.push(bucket[bucket.length - 1]);
      }

      return downsampled;
    }

    /**
     * Calculates rolling average for a single data column.
     * Uses trailing window: avg[i] = mean(data[i-window:i])
     * @param {Array<number>} data - Array of numeric values
     * @param {number} windowSize - Window size for averaging
     * @returns {Array<number>} - Averaged values (same length as input)
     */
    function calculateRollingAverage(data, windowSize) {
      const result = [];
      for (let i = 0; i < data.length; i++) {
        const start = Math.max(0, i - windowSize + 1);
        const end = i + 1;
        const window = data.slice(start, end);
        const avg = window.reduce((sum, val) => sum + val, 0) / window.length;
        result.push(avg);
      }
      return result;
    }

    /**
     * Computes weekend date ranges (Saturday 00:00 to Monday 00:00, local time)
     * overlapping the given [minDate, maxDate] window. Clamps ranges to the window.
     * @param {Date} minDate
     * @param {Date} maxDate
     * @return {Array<{start: Date, end: Date}>}
     */
    function getWeekendRanges(minDate, maxDate) {
      const ranges = [];
      const cursor = new Date(minDate);
      cursor.setHours(0, 0, 0, 0);

      while (cursor <= maxDate) {
        if (cursor.getDay() === 6) { // Saturday: weekend starts
          const weekendStart = new Date(cursor);
          const weekendEnd = new Date(cursor);
          weekendEnd.setDate(weekendEnd.getDate() + 2); // Monday 00:00

          ranges.push({
            start: weekendStart < minDate ? minDate : weekendStart,
            end: weekendEnd > maxDate ? maxDate : weekendEnd
          });
          cursor.setDate(cursor.getDate() + 2);
        } else {
          cursor.setDate(cursor.getDate() + 1);
        }
      }

      return ranges;
    }

    /**
     * Overlays translucent vertical bands over weekend date ranges on the chart.
     * Must be called after the chart's 'ready' event, since it relies on
     * getChartLayoutInterface() for pixel positioning.
     * @param {google.visualization.ComboChart} chart
     * @param {google.visualization.DataTable} dataTable
     * @param {HTMLElement} container
     */
    function renderWeekendBands(chart, dataTable, container) {
      const numRows = dataTable.getNumberOfRows();
      if (numRows === 0) return;

      const minDate = dataTable.getValue(0, 0);
      const maxDate = dataTable.getValue(numRows - 1, 0);
      if (!(minDate instanceof Date) || !(maxDate instanceof Date)) return;

      const layout = chart.getChartLayoutInterface();
      const chartArea = layout.getChartAreaBoundingBox();
      const weekends = getWeekendRanges(minDate, maxDate);

      weekends.forEach((range) => {
        const x1 = layout.getXLocation(range.start);
        const x2 = layout.getXLocation(range.end);
        const left = Math.min(x1, x2);
        const width = Math.abs(x2 - x1);
        if (width <= 0) return;

        const band = document.createElement('div');
        band.className = 'weekend-band';
        band.style.position = 'absolute';
        band.style.left = left + 'px';
        band.style.top = chartArea.top + 'px';
        band.style.width = width + 'px';
        band.style.height = chartArea.height + 'px';
        band.style.background = WEEKEND_BAND_COLOR;
        band.style.pointerEvents = 'none';
        band.style.zIndex = '1';
        container.appendChild(band);
      });
    }

    /**
     * Builds and draws the Stacked Line/Area Chart with Overdue Severity Line Overlay.
     */
    function drawStackedLineComboChart() {
      const chartContainer = document.getElementById('mainChart');
      if (!chartContainer) return;

      const dataTable = buildDecomposedDataTable();
      if (!dataTable || dataTable.getNumberOfRows() === 0) {
        chartContainer.innerHTML = '<div class="loading-spinner">No snapshots available for the selected date range.</div>';
        return;
      }

      const dataView = new google.visualization.DataView(dataTable);
      const visibleCols = [0]; // Time column
      const seriesConfig = {};
      let activeSeriesIdx = 0;

      const showOpen = isChecked('toggleOpen');
      const showOverdue = isChecked('toggleOverdue');
      const showCompleted = isChecked('toggleCompleted');
      const showSeverity = isChecked('toggleSeverity');
      const showRollingAvg = isChecked('toggleRollingAvg');

      // 1. Stacked Lines/Areas on Axis 0 (mutually exclusive segments)
      // Order: Overdue (base/debt) → On-Time Open → Completed (productive)
      if (showOverdue) {
        visibleCols.push(2); // Overdue (base layer)
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.overdue,
          areaOpacity: 0.35,
          lineWidth: 3
        };
      }
      if (showOpen) {
        visibleCols.push(1); // On-Time Open
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.onTimeOpen,
          areaOpacity: 0.25,
          lineWidth: 3
        };
      }
      if (showCompleted) {
        visibleCols.push(3); // Completed
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.completed,
          areaOpacity: 0.20,
          lineWidth: 2
        };
      }

      // 2. Line Overlay on Axis 1 (Severity Debt Score)
      if (showSeverity) {
        visibleCols.push(4); // Severity
        seriesConfig[activeSeriesIdx++] = {
          type: 'line',
          targetAxisIndex: 1,
          color: SERIES_COLORS.severity,
          lineWidth: 3,
          pointSize: 5
        };
      }

      // 3. Rolling Average Lines (if enabled)
      if (showRollingAvg && visibleCols.length > 1) {
        // Compute window size based on data points
        const numRows = dataTable.getNumberOfRows();
        let windowSize = Math.ceil(numRows / ROLLING_AVG_TARGET_BUCKETS);
        windowSize = Math.max(ROLLING_AVG_WINDOW_MIN, Math.min(windowSize, ROLLING_AVG_WINDOW_MAX));

        // Calculate raw rolling averages for each visible series
        const rawAverages = {};
        
        if (showOverdue) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 2) === 'number' ? dataTable.getValue(row, 2) : 0);
          }
          rawAverages[2] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showOpen) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 1) === 'number' ? dataTable.getValue(row, 1) : 0);
          }
          rawAverages[1] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showCompleted) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 3) === 'number' ? dataTable.getValue(row, 3) : 0);
          }
          rawAverages[3] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showSeverity) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 4) === 'number' ? dataTable.getValue(row, 4) : 0);
          }
          rawAverages[4] = calculateRollingAverage(rawVals, windowSize);
        }

        // Apply cumulative stacking to non-severity averages
        // Stack order: Overdue (base) → On-Time Open → Completed
        // stackBase accumulates RAW averages only (not the already-stacked
        // result), otherwise each layer double-counts everything beneath it.
        const stackedAverages = {};
        let stackBase = new Array(numRows).fill(0);

        if (showOverdue) {
          stackedAverages[2] = rawAverages[2].map((val, i) => stackBase[i] + val);
          stackBase = stackBase.map((val, i) => val + rawAverages[2][i]);
        }
        
        if (showOpen) {
          stackedAverages[1] = rawAverages[1].map((val, i) => stackBase[i] + val);
          stackBase = stackBase.map((val, i) => val + rawAverages[1][i]);
        }
        
        if (showCompleted) {
          stackedAverages[3] = rawAverages[3].map((val, i) => stackBase[i] + val);
