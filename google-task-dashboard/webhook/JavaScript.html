<script>
  /**
   * Encapsulated Dashboard Application Module
   */
  const DashboardApp = (function () {
    let rawData = null;
    let activeRangeDays = 30;
    let mainChartInstance = null;
    let resizeTimer = null;
    let stalenessUpdateTimer = null;
    let lastSnapshotTime = null;
    let lastSheetFetchTime = null;
    let autoFetchEnabled = true;
    let autoFetchIntervalMs = 30 * 60 * 1000; // Default 30 minutes
    let autoFetchTimer = null;
    let lastAutoFetchTime = Date.now();

    /**
     * Color definitions for consistent stacked line/area and overlay line visualization.
     */
    const SERIES_COLORS = {
      onTimeOpen: '#1a73e8', // Blue (On-time open tasks)
      overdue: '#d93025',    // Red (Overdue open tasks)
      completed: '#188038',  // Green (Completed tasks)
      severity: '#a142f4'    // Purple (Severity line overlay on right axis)
    };

    /**
     * Initializes Google Charts, notifications container, and fetches dashboard metrics.
     */
    function init() {
      initNotifications();
      initAdminLink();
      google.charts.load('current', { packages: ['corechart'] });
      google.charts.setOnLoadCallback(fetchData);
      setupResizeHandler();
      setupStalenessUpdateTimer();
      setupAutoFetch();
      setupPageVisibilityHandler();
      if (autoFetchEnabled) {
        startAutoFetch();
      }
    }

    /**
     * Debounced window resize event listener.
     */
    function setupResizeHandler() {
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (rawData) renderCharts();
        }, 300);
      });
    }

    /**
     * Initializes the admin link button with the script project ID.
     */
    function initAdminLink() {
      google.script.run.withSuccessHandler((scriptId) => {
        const adminBtn = document.getElementById('btnAdmin');
        if (adminBtn && scriptId) {
          adminBtn.href = 'https://script.google.com/home/projects/' + scriptId + '/edit';
        }
      }).getScriptProjectId();
    }

    /**
     * Initializes the admin link button with the script project ID.
     */
    function initAdminLink() {
      google.script.run.withSuccessHandler((scriptId) => {
        const adminBtn = document.getElementById('btnAdmin');
        if (adminBtn && scriptId) {
          adminBtn.href = 'https://script.google.com/home/projects/' + scriptId + '/edit';
        }
      }).getScriptProjectId();
    }

    /**
     * Sets up timer to update relative age ("xx ago") every 10 seconds without fetching data.
     */
    function setupStalenessUpdateTimer() {
      stalenessUpdateTimer = setInterval(() => {
        if (lastSnapshotTime) {
          updateStalenessDisplay();
        }
      }, 10 * 1000); // Update every 10 seconds
    }

    /**
     * Sets up auto-fetch background polling to refresh sheet data periodically.
     */
    function setupAutoFetch() {
      // Check if toggle exists and is enabled
      const autoFetchCheckbox = document.getElementById('toggleAutoFetch');
      if (autoFetchCheckbox) {
        autoFetchCheckbox.addEventListener('change', (e) => {
          autoFetchEnabled = e.target.checked;
          if (autoFetchEnabled) {
            startAutoFetch();
          } else {
            stopAutoFetch();
          }
        });
      }

      // Check if interval selector exists
      const intervalSelect = document.getElementById('autoFetchInterval');
      if (intervalSelect) {
        intervalSelect.addEventListener('change', (e) => {
          autoFetchIntervalMs = Number(e.target.value) * 60 * 1000; // Convert minutes to ms
          // Restart timer with new interval if enabled
          if (autoFetchEnabled) {
            stopAutoFetch();
            startAutoFetch();
          }
        });
      }
    }

    /**
     * Starts the background auto-fetch timer.
     */
    function startAutoFetch() {
      if (autoFetchTimer) return; // Already running
      autoFetchTimer = setInterval(performAutoFetch, autoFetchIntervalMs);
    }

    /**
     * Stops the background auto-fetch timer.
     */
    function stopAutoFetch() {
      if (autoFetchTimer) {
        clearInterval(autoFetchTimer);
        autoFetchTimer = null;
      }
    }

    /**
     * Performs a background data refresh from sheet (no Tasks API call).
     */
    function performAutoFetch() {
      // Silently fetch data; only show errors
      google.script.run
        .withSuccessHandler((data) => {
          lastAutoFetchTime = Date.now();
          onDataLoaded(data);
        })
        .withFailureHandler((error) => {
          console.error('Auto-fetch error:', error);
        })
        .getDashboardData();
    }

    /**
     * Sets up Page Visibility API to pause/resume auto-fetch when tab is hidden/visible.
     */
    function setupPageVisibilityHandler() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Tab is hidden: pause auto-fetch
          if (autoFetchEnabled) {
            stopAutoFetch();
          }
        } else {
          // Tab is visible: resume auto-fetch
          if (autoFetchEnabled) {
            if (Date.now() - lastAutoFetchTime >= autoFetchIntervalMs) {
              performAutoFetch();
            }
            startAutoFetch();
          }
        }
      });
    }

    /**
     * Initializes dynamic notification container in DOM.
     */
    function initNotifications() {
      if (!document.getElementById('notificationContainer')) {
        const container = document.createElement('div');
        container.id = 'notificationContainer';
        container.className = 'notification-container';
        document.body.appendChild(container);
      }
    }

    /**
     * Displays a compact notification bubble with auto-dismiss.
     * @param {string} message - Text content (supports newlines)
     * @param {string} icon - Emoji icon
     * @param {string} type - 'success' | 'error' | 'info'
     * @param {number} durationMs - Auto-dismiss timeout (ms)
     */
    function showNotification(message, icon, type = 'info', durationMs = 3000) {
      initNotifications();
      const container = document.getElementById('notificationContainer');
      if (!container) return;

      const bubble = document.createElement('div');
      bubble.className = 'notification-bubble ' + type;
      bubble.innerHTML = `
        <span class="notification-icon">${icon}</span>
        <span class="notification-text">${message}</span>
        <button class="notification-dismiss" title="Dismiss">×</button>
      `;

      const dismissBtn = bubble.querySelector('.notification-dismiss');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          bubble.classList.add('dismissing');
          setTimeout(() => bubble.remove(), 250);
        });
      }

      container.appendChild(bubble);

      // Keep max 3 bubbles visible at once
      while (container.children.length > 3) {
        container.removeChild(container.firstChild);
      }

      if (durationMs > 0) {
        setTimeout(() => {
          if (bubble.parentElement) {
            bubble.classList.add('dismissing');
            setTimeout(() => bubble.remove(), 250);
          }
        }, durationMs);
      }
    }

    /**
     * Fetches historical time-series data from backend RPC.
     */
    function fetchData() {
      showStatus('Loading data from Google Sheet...', 'info');
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .getDashboardData();
    }

    /**
     * Handles successful data reception from Apps Script.
     * @param {Object} data - { headers, rows, sheetUrl, triggerActive }
     */
    function onDataLoaded(data) {
      if (!data || !Array.isArray(data.rows)) {
        showStatus('Received invalid data format from server.', 'error');
        return;
      }

      rawData = JSON.parse(JSON.stringify(data));
      hideStatus();

      // Set sheet-fetch timestamp on every successful data load
      lastSheetFetchTime = Date.now();

      if (data.sheetUrl) {
        const link = document.getElementById('sheetLink');
        if (link) link.href = data.sheetUrl;
      }

      const triggerBox = document.getElementById('toggleAutoTrigger');
      if (triggerBox) {
        triggerBox.checked = (typeof data.triggerActive === 'boolean') ? data.triggerActive : true;
      }

      updateKPIsAndStaleness();
      renderCharts();
    }

    /**
     * Handles data load or sync errors with descriptive messages.
     * @param {Error|Object|string} err
     */
    function onDataError(err) {
      const msg = (err && (err.message || err.toString())) || 'Unknown server error';
      showStatus('Operation failed: ' + msg, 'error');
      showNotification(`Error\n${msg}`, '❌', 'error', 5000);
    }

    /**
     * Updates top KPI cards and staleness indicator. Stores snapshot time for relative age updates.
     */
    function updateKPIsAndStaleness() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;

      const rows = rawData.rows;
      const latest = rows[rows.length - 1];

      const totalOpen = typeof latest[1] === 'number' ? latest[1] : 0;
      const completed = typeof latest[2] === 'number' ? latest[2] : 0;
      const overdue = typeof latest[3] === 'number' ? latest[3] : 0;
      const severity = typeof latest[4] === 'number' ? latest[4] : 0;
      const onTime = Math.max(0, totalOpen - overdue);

      setElemText('kpiOpen', totalOpen);
      setElemText('kpiOpenSubtext', onTime + ' on-time + ' + overdue + ' overdue');
      setElemText('kpiCompleted', completed);
      setElemText('kpiOverdue', overdue);
      setElemText('kpiSeverity', severity.toFixed(1));

      const lastDate = new Date(latest[0]);
      if (!isNaN(lastDate.getTime())) {
        lastSnapshotTime = lastDate.getTime();
        updateStalenessDisplay();
      }

      calculateVelocity(rows);
      updateBacklogEstimate(rows);
    }

    /**
     * Updates the relative age display ("xx min ago") without fetching data.
     * Called every 10 seconds by timer, and immediately after data fetch.
     */
    function updateStalenessDisplay() {
      if (lastSnapshotTime) {
        const diffMins = Math.floor((Date.now() - lastSnapshotTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSnapshotTime);

        setElemText('lastSnapshotAge',
          'Last snapshot: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
      }

      if (lastSheetFetchTime) {
        const diffMins = Math.floor((Date.now() - lastSheetFetchTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSheetFetchTime);
        
        const elem = document.getElementById('lastSheetFetchAge');
        if (elem) {
          elem.style.display = 'block';
          setElemText('lastSheetFetchAge',
            'Last sheet fetch: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
        }
      }
    }

    /**
     * Formats relative time string for display.
     * @param {number} minutes - Minutes elapsed
     * @return {string}
     */
    function formatTimeAgo(minutes) {
      if (minutes < 1) return 'Just now';
      if (minutes < 60) return Math.floor(minutes) + ' min ago';
      const hours = minutes / 60;
      if (hours < 24) return hours.toFixed(1) + ' hr ago';
      return Math.floor(hours / 24) + ' day' + (hours >= 48 ? 's' : '') + ' ago';
    }

    /**
     * Calculates task addition rate over the selected historical window.
     * Addition rate = (open_start - open_end + completed_in_period) / days_elapsed
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks added per day
     */
    function calculateAdditionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * 24 * 60 * 60 * 1000);

      const windowRows = rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });

      if (windowRows.length < 2) return 0;

      const oldestOpen = typeof windowRows[0][1] === 'number' ? windowRows[0][1] : 0;
      const newestOpen = typeof windowRows[windowRows.length - 1][1] === 'number' ? windowRows[windowRows.length - 1][1] : 0;
      const completedInPeriod = calculateCompletionsInWindow(windowRows);

      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / (1000 * 60 * 60 * 24);

      // Addition rate = (open_start - open_end + completed) / days
      const additionRate = (oldestOpen - newestOpen + completedInPeriod) / elapsedDays;
      return Math.max(0, additionRate);
    }

    /**
     * Sums positive completion deltas in a window (ignores purges/deletes).
     * @param {Array<Array<any>>} windowRows - Snapshot rows in the window
     * @return {number} - Total completions
     */
    function calculateCompletionsInWindow(windowRows) {
      let total = 0;
      for (let i = 1; i < windowRows.length; i++) {
        const delta = windowRows[i][2] - windowRows[i - 1][2];
        if (delta > 0) total += delta;
      }
      return total;
    }

    /**
     * Calculates completion rate over the selected historical window.
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks completed per day
     */
    function calculateCompletionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * 24 * 60 * 60 * 1000);

      const windowRows = rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });

      if (windowRows.length < 2) return 0;

      const completions = calculateCompletionsInWindow(windowRows);
      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / (1000 * 60 * 60 * 24);

      return completions / elapsedDays;
    }

    /**
     * Calculates estimated days to backlog completion.
     * @param {number} currentOpen - Current open task count
     * @param {number} completionRate - Tasks completed per day
     * @param {number} additionRate - Tasks added per day
     * @return {string|number} - Days to completion, "Cannot estimate", or "∞"
     */
    function calculateDaysToCompletion(currentOpen, completionRate, additionRate) {
      if (currentOpen <= 0) return '0';
      if (completionRate <= additionRate) return 'Cannot estimate';

      const netRate = completionRate - additionRate;
      const days = currentOpen / netRate;
      if (!isFinite(days) || days < 0) return 'Cannot estimate';

      // Return as integer if >= 1 day, else 1 decimal place
      if (days >= 1) return Math.round(days).toString();
      return days.toFixed(1);
    }

    /**
     * Updates backlog completion estimate in the UI.
     * Called from updateKPIsAndStaleness after calculating completion rate.
     */
    function updateBacklogEstimate(rows) {
      const estCard = document.getElementById('backlogEstimateCard');
      if (!estCard) return;

      if (!rows || rows.length === 0) {
        estCard.style.display = 'none';
        return;
      }

      const currentOpen = typeof rows[rows.length - 1][1] === 'number' ? rows[rows.length - 1][1] : 0;
      const completionRate = calculateCompletionRate(rows, activeRangeDays);
      const additionRate = calculateAdditionRate(rows, activeRangeDays);
      const estimate = calculateDaysToCompletion(currentOpen, completionRate, additionRate);

      // Show card unless backlog is zero
      if (estimate === '0') {
        estCard.style.display = 'none';
      } else {
        estCard.style.display = 'block';
        const label = document.getElementById('backlogEstimateValue');
        const note = document.getElementById('backlogEstimateNote');
        if (label) {
          label.textContent = estimate;
          // Use a smaller font for text-based values so they fit on one line
          label.classList.toggle('value-compact', isNaN(Number(estimate)));
        }
        if (note) {
          if (estimate === 'Cannot estimate') {
            note.textContent = 'Adding ~' + additionRate.toFixed(1) + '/day vs completing ~' + completionRate.toFixed(1) + '/day';
          } else {
            const rangeLabel = activeRangeDays === 'all' ? 'all time' : activeRangeDays + ' days';
            note.textContent = 'Based on rates over past ' + rangeLabel;
          }
        }
      }
    }

    /**
     * Calculates completion throughput velocity over 7-day window.
     * Sums only positive increments between snapshots to survive purges/deletes.
     * Uses actual elapsed time between oldest and newest snapshots.
     * @param {Array<Array<any>>} rows
     */
    function calculateVelocity(rows) {
      const calculate = (days) => {
        const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
        const recentRows = rows.filter(r =>
          new Date(r[0]).getTime() >= cutoff
        );

        if (recentRows.length < 2) return '-';

        let totalCompletions = 0;
        for (let i = 1; i < recentRows.length; i++) {
          const delta = recentRows[i][2] - recentRows[i - 1][2];
          if (delta > 0) totalCompletions += delta;
        }

        const oldestTime = new Date(recentRows[0][0]).getTime();
        const newestTime = new Date(recentRows[recentRows.length - 1][0]).getTime();
        const elapsedDays =
          Math.max(1, newestTime - oldestTime) / (1000 * 60 * 60 * 24);

        return (totalCompletions / elapsedDays).toFixed(1);
      };

      setElemText(
        'kpiVelocitySubtext',
        '24h: ' + calculate(1) +
        ' &nbsp; 3d: ' + calculate(3) +
        ' &nbsp; 7d: ' + calculate(7) + ' /day'
      );
    }

    /**
     * Re-renders the primary chart.
     */
    function renderCharts() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;
      drawStackedLineComboChart();
    }

    /**
     * Helper to safely read checkbox state with DOM null guard.
     */
    function isChecked(elemId) {
      const el = document.getElementById(elemId);
      return el ? Boolean(el.checked) : false;
    }

    /**
     * Safe DOM text updater with null guard.
     */
    function setElemText(elemId, text) {
      const el = document.getElementById(elemId);
      if (el) el.textContent = text;
    }

    /**
     * Retrieves local timezone label.
     */
    function getLocalTimezoneLabel() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      } catch (e) {
        return 'Local';
      }
    }

    /**
     * Downsamples data to reduce rendered points while preserving trend.
     * Uses binning: groups consecutive rows into buckets and keeps the latest in each bucket.
     * @param {Array<Array<any>>} rows - Array of snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} targetBuckets - Target number of buckets (default 50)
     * @returns {Array<Array<any>>} - Downsampled rows
     */
    function downsampleData(rows, targetBuckets = 50) {
      if (rows.length <= targetBuckets) return rows;

      const bucketSize = Math.ceil(rows.length / targetBuckets);
      const downsampled = [];

      for (let i = 0; i < rows.length; i += bucketSize) {
        const bucket = rows.slice(i, i + bucketSize);
        // Keep the latest (last) row in each bucket
        downsampled.push(bucket[bucket.length - 1]);
      }

      return downsampled;
    }

    /**
     * Calculates rolling average for a single data column.
     * Uses trailing window: avg[i] = mean(data[i-window:i])
     * @param {Array<number>} data - Array of numeric values
     * @param {number} windowSize - Window size for averaging
     * @returns {Array<number>} - Averaged values (same length as input)
     */
    function calculateRollingAverage(data, windowSize) {
      const result = [];
      for (let i = 0; i < data.length; i++) {
        const start = Math.max(0, i - windowSize + 1);
        const end = i + 1;
        const window = data.slice(start, end);
        const avg = window.reduce((sum, val) => sum + val, 0) / window.length;
        result.push(avg);
      }
      return result;
    }

    /**
     * Downsamples data to reduce rendered points while preserving trend.
     * Uses binning: groups consecutive rows into buckets and keeps the latest in each bucket.
     * @param {Array<Array<any>>} rows - Array of snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} targetBuckets - Target number of buckets (default 50)
     * @returns {Array<Array<any>>} - Downsampled rows
     */
    function downsampleData(rows, targetBuckets = 50) {
      if (rows.length <= targetBuckets) return rows;

      const bucketSize = Math.ceil(rows.length / targetBuckets);
      const downsampled = [];

      for (let i = 0; i < rows.length; i += bucketSize) {
        const bucket = rows.slice(i, i + bucketSize);
        // Keep the latest (last) row in each bucket
        downsampled.push(bucket[bucket.length - 1]);
      }

      return downsampled;
    }

    /**
     * Builds and draws the Stacked Line/Area Chart with Overdue Severity Line Overlay.
     */
    function drawStackedLineComboChart() {
      const chartContainer = document.getElementById('mainChart');
      if (!chartContainer) return;

      const dataTable = buildDecomposedDataTable();
      if (!dataTable || dataTable.getNumberOfRows() === 0) {
        chartContainer.innerHTML = '<div class="loading-spinner">No snapshots available for the selected date range.</div>';
        return;
      }

      const dataView = new google.visualization.DataView(dataTable);
      const visibleCols = [0]; // Time column
      const seriesConfig = {};
      let activeSeriesIdx = 0;

      const showOpen = isChecked('toggleOpen');
      const showOverdue = isChecked('toggleOverdue');
      const showCompleted = isChecked('toggleCompleted');
      const showSeverity = isChecked('toggleSeverity');
      const showRollingAvg = isChecked('toggleRollingAvg');

      // 1. Stacked Lines/Areas on Axis 0 (mutually exclusive segments)
      // Order: Overdue (base/debt) → On-Time Open → Completed (productive)
      if (showOverdue) {
        visibleCols.push(2); // Overdue (base layer)
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.overdue,
          areaOpacity: 0.35,
          lineWidth: 3
        };
      }
      if (showOpen) {
        visibleCols.push(1); // On-Time Open
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.onTimeOpen,
          areaOpacity: 0.25,
          lineWidth: 3
        };
      }
      if (showCompleted) {
        visibleCols.push(3); // Completed
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.completed,
          areaOpacity: 0.20,
          lineWidth: 2
        };
      }

      // 2. Line Overlay on Axis 1 (Severity Debt Score)
      if (showSeverity) {
        visibleCols.push(4); // Severity
        seriesConfig[activeSeriesIdx++] = {
          type: 'line',
          targetAxisIndex: 1,
          color: SERIES_COLORS.severity,
          lineWidth: 3,
          pointSize: 5
        };
      }

      // 3. Rolling Average Lines (if enabled)
      if (showRollingAvg && visibleCols.length > 1) {
        // Compute window size based on data points
        const numRows = dataTable.getNumberOfRows();
        let windowSize = Math.ceil(numRows / 50);
        windowSize = Math.max(2, Math.min(windowSize, 168)); // Clamp: min 2, max 168

        // Add rolling average columns for each visible *raw* series (not severity)
        // Rolling averages should track the raw series they're derived from
        const avgCols = [];
        // Map: if we added overdue first (base), then open, then completed
        // We want averages for: overdue (col 2), open (col 1), completed (col 3)
        // Check which series are visible and add their averages in the same order
        if (showOverdue) avgCols.push(2); // Overdue average
        if (showOpen) avgCols.push(1);     // Open average
        if (showCompleted) avgCols.push(3); // Completed average
        if (showSeverity) avgCols.push(4); // Severity average

        // Calculate averages using the same cumulative stacking as the
        // raw series. This keeps average lines aligned with stack boundaries.
        const seriesData = {};
        const stackedAverage = new Array(numRows).fill(0);

        for (let colIdx of avgCols) {
          const rawValues = [];
          for (let row = 0; row < numRows; row++) {
            const val = dataTable.getValue(row, colIdx);
            rawValues.push(typeof val === 'number' ? val : 0);
          }

          const average = calculateRollingAverage(rawValues, windowSize);

          if (colIdx === 4) {
            // Severity is an independent secondary-axis series.
            seriesData[colIdx] = average;
          } else {
            for (let row = 0; row < numRows; row++) {
              stackedAverage[row] += average[row];
            }
            seriesData[colIdx] = stackedAverage.slice();
          }
        }

        // Add rolling average columns to the data table
        const colCount = dataTable.getNumberOfColumns();
        const avgColMap = {}; // Map original col index to new avg col index

        for (let colIdx of avgCols) {
          dataTable.addColumn('number', 'Avg ' + dataTable.getColumnLabel(colIdx));
          avgColMap[colIdx] = colCount + avgCols.indexOf(colIdx);

          // Populate the rolling average column
          for (let row = 0; row < numRows; row++) {
            dataTable.setValue(row, dataTable.getNumberOfColumns() - 1, seriesData[colIdx][row]);
          }
        }

        // Add rolling average columns to visible columns and configure their styling
        // Key: set type to 'line' and ensure they're NOT in the stacking calculation
        for (let colIdx of avgCols) {
          const avgColIdx = avgColMap[colIdx];
          visibleCols.push(avgColIdx);

          // Determine color based on original series
          let color = SERIES_COLORS.onTimeOpen;
          let axisIdx = 0;
          if (colIdx === 2) color = SERIES_COLORS.overdue;
          else if (colIdx === 3) color = SERIES_COLORS.completed;
          else if (colIdx === 4) {
            color = SERIES_COLORS.severity;
            axisIdx = 1;
          }

          seriesConfig[activeSeriesIdx++] = {
            type: 'line', // Critical: lines don't participate in stacking
            targetAxisIndex: axisIdx,
            color: color,
            lineWidth: 2,
            lineDashStyle: [5, 5], // Dotted line
            pointSize: 0,
            opacity: 0.6
          };
        }
      }

      if (visibleCols.length === 1) {
        chartContainer.innerHTML = '<div class="loading-spinner">Select at least one metric series above to render chart.</div>';
        return;
      }

      if (chartContainer.querySelector('.loading-spinner')) {
        chartContainer.innerHTML = '';
        mainChartInstance = null;
      }

      dataView.setColumns(visibleCols);

      // Format severity column (index 4) to 1 decimal place
      const severityFormatter = new google.visualization.NumberFormat('#.0');
      if (visibleCols.includes(4)) {
        // Find the position of column 4 in visibleCols
        const severityIdx = visibleCols.indexOf(4);
        if (severityIdx !== -1) {
          severityFormatter.format(dataView, severityIdx);
        }
      }

      const tzLabel = getLocalTimezoneLabel();
      const options = {
        seriesType: 'area',
        isStacked: true,
        series: seriesConfig,
        vAxes: {
          0: { title: 'Task Volume (Stacked)', minValue: 0, gridlines: { color: '#f1f3f4' } },
          1: { title: 'Overdue Severity (√days)', minValue: 0, gridlines: { color: 'transparent' } }
        },
        hAxis: {
          title: 'Time (' + tzLabel + ')',
          gridlines: { color: '#f1f3f4' }
        },
        legend: { position: 'top', alignment: 'end' },
        chartArea: { left: 60, right: 70, top: 30, bottom: 60, width: '85%', height: '75%' },
        pointSize: 3,
        interpolateNulls: true,
        backgroundColor: 'transparent'
      };

      if (!mainChartInstance) {
        mainChartInstance = new google.visualization.ComboChart(chartContainer);
      }
      mainChartInstance.draw(dataView, options);
    }

    /**
     * Constructs a decomposed DataTable where open tasks are split into On-Time Open and Overdue.
     */
    function buildDecomposedDataTable() {
      if (!rawData || !rawData.rows) return null;

      const dataTable = new google.visualization.DataTable();
      dataTable.addColumn('datetime', 'Time');
      dataTable.addColumn('number', 'On-Time Open');
      dataTable.addColumn('number', 'Overdue');
      dataTable.addColumn('number', 'Completed');
      dataTable.addColumn('number', 'Overdue Severity (√days)');

      const now = Date.now();
      const cutoff = activeRangeDays === 'all'
        ? null
        : new Date(now - (Number(activeRangeDays) || 30) * 24 * 60 * 60 * 1000);

      const validRows = [];
      for (let i = 0; i < rawData.rows.length; i++) {
        const row = rawData.rows[i];
        if (!row || !row[0]) continue;

        let dateObj = new Date(row[0]);
        if (isNaN(dateObj.getTime())) {
          dateObj = new Date(0);
        }

        if (cutoff && dateObj < cutoff) continue;

        const totalOpen = typeof row[1] === 'number' ? Math.max(0, row[1]) : 0;
        const completed = typeof row[2] === 'number' ? Math.max(0, row[2]) : 0;
        const overdue = typeof row[3] === 'number' ? Math.max(0, row[3]) : 0;
        const severity = typeof row[4] === 'number' ? Math.max(0, row[4]) : 0;

        const onTimeOpen = Math.max(0, totalOpen - overdue);
        validRows.push([dateObj, onTimeOpen, overdue, completed, severity]);
      }

      // Apply downsampling for large datasets
      const downsampledRows = downsampleData(validRows);
      dataTable.addRows(downsampledRows);
      return dataTable;
    }

    /**
     * Sanitizes and sets the active date range filter.
     * @param {number|string} range
     */
    function setRangeFilter(range) {
      activeRangeDays = (range === 'all') ? 'all' : (Number(range) || 30);

      const pills = document.querySelectorAll('#rangeFilterGroup .pill');
      pills.forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-range') === String(range));
      });

      renderCharts();
    }

    /**
     * Handles series checkbox toggles and re-renders.
     */
    function updateChartVisibility() {
      renderCharts();
    }

    /**
     * Re-reads existing snapshot rows directly from the Google Sheet without calling Tasks API.
     */
    function handleReloadData() {
      setButtonsDisabled(true);
      showStatus('Reloading data from Google Sheet...', 'info');

      google.script.run
        .withSuccessHandler((data) => {
          setButtonsDisabled(false);
          showStatus('Data reloaded successfully!', 'success');
          showNotification('Data Reloaded\nRefreshing dashboard...', '🔄', 'success', 2000);
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .getDashboardData();
    }

    /**
     * Triggers Manual Sync Now RPC with UI lock.
     */
    function handleSyncNow() {
      setButtonsDisabled(true);
      showStatus('Syncing tasks across all lists from Google Tasks API...', 'info');

      google.script.run
        .withSuccessHandler((data) => {
          setButtonsDisabled(false);
          showStatus('Sync completed successfully!', 'success');
          if (data && data.rows && data.rows.length > 0) {
            const latest = data.rows[data.rows.length - 1];
            showNotification(`Sync Complete\n${latest[1]} open, ${latest[3]} overdue`, '✅', 'success', 3000);
          }
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .syncNow();
    }

    /**
     * Deletes tasks completed more than 8 weeks ago from Google Tasks across all lists.
     */
    function handleDeleteOldCompletedTasks() {
      const confirmed = confirm(
        '⚠️ DELETE OLD COMPLETED TASKS (>8 WEEKS)\n\n' +
        'This will permanently delete tasks that were completed more than 8 weeks ago across all your Google Task lists.\n\n' +
        'Recent completed tasks (<8 weeks) will be kept intact.\n\n' +
        'Proceed?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Deleting tasks completed > 8 weeks ago across all lists...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Delete failed: ' + errMsg, 'error');
            showNotification(`Delete failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showStatus(`Deleted ${result.tasksDeleted} old completed tasks. Refreshing dashboard...`, 'success');
          showNotification(`Old Completed Tasks Deleted\n${result.tasksDeleted} tasks removed (>8w)`, '🗑️', 'success', 4000);
          if (result.data) {
            onDataLoaded(result.data);
          } else {
            fetchData();
          }
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .deleteOldCompletedTasks(8);
    }

    /**
     * Triggers Sync & Clear Completed Tasks RPC with confirmation.
     */
    function handleSyncAndClear() {
      const confirmed = confirm(
        '⚠️ PERMANENT ACTION:\n\n' +
        'This will persist the latest metrics to the Google Sheet and CLEAR/ARCHIVE all completed tasks across all your Google Task lists.\n\n' +
        'Are you sure you want to proceed?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Persisting metrics and purging completed tasks across all lists...', 'info');

      google.script.run
        .withSuccessHandler((data) => {
          setButtonsDisabled(false);
          showStatus('Completed tasks purged and snapshot persisted successfully!', 'success');
          if (data && data.rows && data.rows.length > 0) {
            const latest = data.rows[data.rows.length - 1];
            showNotification(`Completed tasks purged\n${latest[2]} tasks cleared`, '🔥', 'success', 4000);
          }
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .syncAndClearTasks();
    }

    /**
     * Triggers manual pruning of records older than 1 year to 1 per day.
     */
    function handlePruneOldData() {
      const confirmed = confirm(
        '⚠️ PRUNE DATA OLDER THAN 1 YEAR\n\n' +
        'This will reduce all data older than 12 months to 1 entry per day, removing intermediate snapshots.\n\n' +
        'Your recent data (<1 year) remains untouched.\n\n' +
        'Continue?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Pruning snapshots older than 1 year down to 1 per day...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Prune failed: ' + errMsg, 'error');
            showNotification(`Prune failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showPruneResultModal(result);
          showStatus('Pruning complete. Refreshing dashboard...', 'success');
          showNotification(`Pruned ${result.totalPruned} rows\nReduced to 1/day`, '🧹', 'success', 4000);
          fetchData();
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .pruneDataOlderThan1Year();
    }

    function handleDownsampleLastYear() {
      const confirmed = confirm(
        '⚠️ DOWNSAMPLE LAST YEAR TO 1/HOUR\n\n' +
        'This will reduce snapshots from the last 365 days to at most 1 entry per rolling 60-minute window, keeping only the latest snapshot in each window.\n\n' +
        'This permanently removes intra-hour data and cannot be undone.\n\n' +
        'Data older than 1 year is not affected by this action.\n\n' +
        'Continue?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Downsampling last year of snapshots to 1 per hour...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Downsample failed: ' + errMsg, 'error');
            showNotification(`Downsample failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showDownsampleResultModal(result);
          showStatus('Downsampling complete. Refreshing dashboard...', 'success');
          showNotification(`Removed ${result.totalRemoved} rows\nReduced to 1/hour`, '📉', 'success', 4000);
          fetchData();
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .downsampleLastYearToHourly();
    }

    /**
     * Displays a clean formatted result modal with downsampling statistics.
     * @param {Object} result
     */
    function showDownsampleResultModal(result) {
      const existing = document.getElementById('downsampleResultModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'downsampleResultModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-card">
          <h3>✅ Downsampling Complete</h3>
          <table class="prune-stats-table">
            <tr><td>Total rows before:</td><td>${result.totalBefore}</td></tr>
            <tr><td>Rows removed:</td><td>${result.totalRemoved}</td></tr>
            <tr><td>Rows remaining:</td><td>${result.totalAfter}</td></tr>
            <tr><td>Percentage removed:</td><td>${Number(result.percentageRemoved || 0).toFixed(1)}%</td></tr>
            <tr><td>Execution time:</td><td>${result.durationMs}ms</td></tr>
          </table>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="document.getElementById('downsampleResultModal').remove()">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    /**
     * Displays a clean formatted result modal with pruning statistics.
     * @param {Object} result
     */
    function showPruneResultModal(result) {
      const existing = document.getElementById('pruneResultModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'pruneResultModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-card">
          <h3>✅ Pruning Complete</h3>
          <table class="prune-stats-table">
            <tr><td>Total rows before:</td><td>${result.totalBefore}</td></tr>
            <tr><td>Rows pruned:</td><td>${result.totalPruned}</td></tr>
            <tr><td>Rows remaining:</td><td>${result.totalAfter}</td></tr>
            <tr><td>Percentage removed:</td><td>${Number(result.percentageRemoved || 0).toFixed(1)}%</td></tr>
            <tr><td>Execution time:</td><td>${result.durationMs}ms</td></tr>
          </table>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="document.getElementById('pruneResultModal').remove()">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    /**
     * Toggles 3-hour automated background sync trigger.
     * @param {boolean} enable
     */
    function handleTriggerToggle(enable) {
      showStatus((enable ? 'Enabling' : 'Disabling') + ' automated 3h sync trigger...', 'info');
      google.script.run
        .withSuccessHandler((isActive) => {
          showStatus('Automated background trigger ' + (isActive ? 'enabled' : 'disabled') + '.', 'success');
          showNotification(
            isActive ? 'Auto-sync Enabled\nEvery 3 hours' : 'Auto-sync Disabled\nManual sync only',
            isActive ? '⚡' : '🛑',
            'success',
            2000
          );
          const triggerBox = document.getElementById('toggleAutoTrigger');
          if (triggerBox) triggerBox.checked = isActive;
        })
        .withFailureHandler(onDataError)
        .setTriggerEnabled(enable);
    }

    function setButtonsDisabled(disabled) {
      const btnSync = document.getElementById('btnSyncNow');
      const btnReload = document.getElementById('btnReloadData');
      const btnDeleteOld = document.getElementById('btnDeleteOldCompleted');
      const btnClear = document.getElementById('btnSyncClear');
      const btnDownsample = document.getElementById('btnDownsampleLastYear');
      const btnPrune = document.getElementById('btnPruneOldData');
      if (btnSync) btnSync.disabled = disabled;
      if (btnReload) btnReload.disabled = disabled;
      if (btnDeleteOld) btnDeleteOld.disabled = disabled;
      if (btnClear) btnClear.disabled = disabled;
      if (btnDownsample) btnDownsample.disabled = disabled;
      if (btnPrune) btnPrune.disabled = disabled;
    }

    function showStatus(message, type) {
      const banner = document.getElementById('statusBanner');
      if (!banner) return;
      banner.className = 'status-banner ' + type;
      banner.innerText = message;
      banner.style.display = 'block';
    }

    function hideStatus() {
      const banner = document.getElementById('statusBanner');
      if (banner) banner.style.display = 'none';
    }

    // Public API
    return {
      init: init,
      setRangeFilter: setRangeFilter,
      updateChartVisibility: updateChartVisibility,
      handleReloadData: handleReloadData,
      handleSyncNow: handleSyncNow,
      handleDeleteOldCompletedTasks: handleDeleteOldCompletedTasks,
      handleSyncAndClear: handleSyncAndClear,
      handleDownsampleLastYear: handleDownsampleLastYear,
      handlePruneOldData: handlePruneOldData,
      handleTriggerToggle: handleTriggerToggle
    };
  })();

  // Initialize on load
  DashboardApp.init();
</script>
