<script>
  /**
   * Encapsulated Dashboard Application Module
   */
  const DashboardApp = (function () {
    let rawData = null;
    let activeRangeDays = 30;
    let mainChartInstance = null;
    let resizeTimer = null;
    let stalenessUpdateTimer = null;
    let lastSnapshotTime = null;
    let lastSheetFetchTime = null;
    let autoFetchEnabled = true;
    let autoFetchIntervalMs = 30 * 60 * 1000; // Default 30 minutes
    let autoFetchTimer = null;
    let lastAutoFetchTime = Date.now();

    // Magic number constants
    const RESIZE_DEBOUNCE_MS = 300;
    const STALENESS_UPDATE_INTERVAL_MS = 10 * 1000;
    const NOTIFICATION_ANIMATION_MS = 250;
    const NOTIFICATION_ERROR_DURATION_MS = 5000;
    const MS_PER_DAY = 1000 * 60 * 60 * 24;
    const DOWNSAMPLE_TARGET_BUCKETS = 50;
    const ROLLING_AVG_WINDOW_MIN = 2;
    const ROLLING_AVG_WINDOW_MAX = 168;
    const ROLLING_AVG_TARGET_BUCKETS = 35;
    const ROLLING_AVG_OPACITY = 0.6;
    const ROLLING_AVG_LINE_DASH = [5, 5];
    const VELOCITY_WINDOW_1D = 1;
    const VELOCITY_WINDOW_3D = 3;
    const VELOCITY_WINDOW_7D = 7;
    const ETA_THRESHOLD_GOOD = 14;
    const ETA_THRESHOLD_CAUTION = 30;
    const WEEKEND_BAND_COLOR = 'rgba(95, 99, 104, 0.08)';

    // Trajectory Weather landscape constants
    const LANDSCAPE_BASELINE_WINDOW_DAYS = 14;
    const LANDSCAPE_ALL_RANGE_WINDOW_DAYS = 30;
    const LANDSCAPE_TRANSITION_DURATION_S = 0.8;
    const LANDSCAPE_METRIC_NEUTRAL = 0.5;
    const LANDSCAPE_TREND_CENTER = 0.85;
    const LANDSCAPE_TREND_SCALE = 0.3;
    const LANDSCAPE_MAX_FRAME_DT = 0.05;
    const LANDSCAPE_WEATHER_THRESHOLDS = {
      storm: 0.20,
      heavy: 0.40,
      steady: 0.60,
      clearing: 0.78
    };
    const LANDSCAPE_WEATHER_STATES = [
      { key: 'storm', color: '#3c4750', opacityMid: 0.72, sizeMid: 96, vxRange: [42, 56], spawnMs: [260, 440], rain: true },
      { key: 'heavy', color: '#556169', opacityMid: 0.58, sizeMid: 74, vxRange: [34, 46], spawnMs: [520, 760], rain: true },
      { key: 'steady', color: '#93a2a8', opacityMid: 0.40, sizeMid: 54, vxRange: [26, 36], spawnMs: [820, 1150], rain: false },
      { key: 'clearing', color: '#d6e0e0', opacityMid: 0.20, sizeMid: 36, vxRange: [20, 28], spawnMs: [1500, 2100], rain: false },
      { key: 'clear', color: '#f2f6f6', opacityMid: 0.07, sizeMid: 22, vxRange: [16, 22], spawnMs: [4200, 7000], rain: false }
    ];

    /**
     * Color definitions for consistent stacked line/area and overlay line visualization.
     */
    const SERIES_COLORS = {
      onTimeOpen: '#1a73e8', // Blue (On-time open tasks)
      overdue: '#d93025',    // Red (Overdue open tasks)
      completed: '#188038',  // Green (Completed tasks)
      severity: '#a142f4'    // Purple (Severity line overlay on right axis)
    };

    /**
     * Extracts task weight from title prefix (mirrors backend implementation).
     * Prefix rules: no prefix = 1, "!" = 2, "!!" = 3, "!!!" = 4, "!!!!" = 5.
     * @param {string} title - Task title
     * @return {number} - Weight (1-5)
     */
    function getTaskWeight(title) {
      if (!title || typeof title !== 'string') return 1;
      const match = title.match(/^!{1,4}/);
      if (!match) return 1;
      return match[0].length + 1;
    }

    // -----------------------------------------------------------------------
    // Trajectory Weather — background landscape layer
    // -----------------------------------------------------------------------
    const Landscape = (function () {
      let canvas, ctx;
      let backdropCanvas, backdropCtx;
      let foregroundCanvas, foregroundCtx;
      let dpr = 1;
      let W = 0, H = 0;
      let ridgeSeedBack = [];
      let ridgeSeedFront = [];
      let treeSeed = [];
      let lastFrameTs = null;
      let started = false;

      const state = {
        currentMetric: LANDSCAPE_METRIC_NEUTRAL,
        targetMetric: LANDSCAPE_METRIC_NEUTRAL,
        transitionProgress: 1.0,
        activeRangeHours: 72 // default 3D, updated by setRangeFilter
      };

      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }

      /**
       * Deterministic pseudo-random hash for decorrelating cloud properties.
       * Using the snapshot timestamp keeps each cloud stable when rows are
       * added or removed, while avoiding correlation with its row position.
       */
      function pseudoRandom(seed) {
        const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function cloudRandoms(snapshotTimestamp) {
        const base = snapshotTimestamp;
        return {
          y: pseudoRandom(base + 1.17),
          size: pseudoRandom(base + 2.31),
          opacity: pseudoRandom(base + 3.53),
          shape: pseudoRandom(base + 4.79),
          bob: pseudoRandom(base + 5.97)
        };
      }

      function hexToRgb(hex) {
        const v = parseInt(hex.replace('#', ''), 16);
        return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
      }
      function rgbToCss(rgb, alpha) {
        return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha + ')';
      }

      function stateFor(metric) {
        const t = LANDSCAPE_WEATHER_THRESHOLDS;
        if (metric < t.storm) return LANDSCAPE_WEATHER_STATES[0];
        if (metric < t.heavy) return LANDSCAPE_WEATHER_STATES[1];
        if (metric < t.steady) return LANDSCAPE_WEATHER_STATES[2];
        if (metric < t.clearing) return LANDSCAPE_WEATHER_STATES[3];
        return LANDSCAPE_WEATHER_STATES[4];
      }

      /**
       * Sets the target metric for the current range. Triggers a smooth
       * transition rather than snapping. Called from setRangeFilter() and
       * whenever fresh data loads.
       */
      function setTargetMetric(metric) {
        if (Math.abs(state.targetMetric - metric) > 0.005) {
          state.targetMetric = metric;
          state.transitionProgress = 0.0;
        }
      }

      function setActiveRangeDays(rangeDays) {
        const effectiveDays = (rangeDays === 'all') ? LANDSCAPE_ALL_RANGE_WINDOW_DAYS : (Number(rangeDays) || LANDSCAPE_ALL_RANGE_WINDOW_DAYS);
        state.activeRangeHours = effectiveDays * 24;
      }

      function updateTransition(dt) {
        if (state.transitionProgress < 1.0) {
          state.transitionProgress = Math.min(1.0, state.transitionProgress + dt / LANDSCAPE_TRANSITION_DURATION_S);
          state.currentMetric = lerp(state.currentMetric, state.targetMetric, state.transitionProgress);
        }
      }

      function resize() {
        if (!canvas) return;
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        ridgeSeedBack = [];
        ridgeSeedFront = [];
        treeSeed = [];

        drawBackdrop();
        drawForeground();
      }

      function buildRidge(seedArr, count) {
        if (seedArr.length === 0) {
          for (let i = 0; i <= count; i++) seedArr.push(Math.random());
        }
        return seedArr;
      }

      function drawRidge(c, seeds, baseY, amp, color, alpha) {
        c.globalAlpha = alpha;
        c.fillStyle = color;
        c.beginPath();
        c.moveTo(0, H);
        const step = W / (seeds.length - 1);
        c.lineTo(0, baseY - seeds[0] * amp);
        for (let i = 1; i < seeds.length; i++) {
          const x = i * step;
          const y = baseY - seeds[i] * amp;
          const prevX = (i - 1) * step;
          const prevY = baseY - seeds[i - 1] * amp;
          const cx = (prevX + x) / 2;
          c.quadraticCurveTo(prevX, prevY, cx, (prevY + y) / 2);
        }
        c.lineTo(W, baseY);
        c.lineTo(W, H);
        c.closePath();
        c.fill();
        c.globalAlpha = 1;
      }

      function drawBackdrop() {
        backdropCanvas.width = W * dpr;
        backdropCanvas.height = H * dpr;
        backdropCanvas.style.width = W + 'px';
        backdropCanvas.style.height = H + 'px';
        backdropCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const sky = backdropCtx.createLinearGradient(0, 0, 0, H * 0.7);
        sky.addColorStop(0, '#9fc4cf');
        sky.addColorStop(1, '#e4ecec');
        backdropCtx.fillStyle = sky;
        backdropCtx.fillRect(0, 0, W, H);

        const seedsBack = buildRidge(ridgeSeedBack, 10);
        drawRidge(backdropCtx, seedsBack, H * 0.66, H * 0.16, '#9fc0b8', 0.85);

        const seedsFront = buildRidge(ridgeSeedFront, 12);
        drawRidge(backdropCtx, seedsFront, H * 0.72, H * 0.13, '#7fa39a', 1);
      }

      function drawTree(c, x, y, h, color) {
        c.fillStyle = color;
        const w = h * 0.55;
        c.beginPath();
        c.moveTo(x, y - h);
        c.lineTo(x - w * 0.5, y - h * 0.35);
        c.lineTo(x - w * 0.32, y - h * 0.35);
        c.lineTo(x - w * 0.62, y + h * 0.08);
        c.lineTo(x - w * 0.4, y + h * 0.08);
        c.lineTo(x - w * 0.7, y + h * 0.42);
        c.lineTo(x + w * 0.7, y + h * 0.42);
        c.lineTo(x + w * 0.4, y + h * 0.08);
        c.lineTo(x + w * 0.62, y + h * 0.08);
        c.lineTo(x + w * 0.32, y - h * 0.35);
        c.lineTo(x + w * 0.5, y - h * 0.35);
        c.closePath();
        c.fill();
        c.fillStyle = 'rgba(0,0,0,.18)';
        c.fillRect(x - 3, y + h * 0.42, 6, h * 0.12);
      }

      function drawHouse(c, x, y, w, h) {
        c.fillStyle = '#5a7a6e';
        c.fillRect(x - w / 2, y - h * 0.55, w, h * 0.55);

        c.fillStyle = '#8b6f47';
        c.beginPath();
        c.moveTo(x - w / 2, y - h * 0.55);
        c.lineTo(x, y - h);
        c.lineTo(x + w / 2, y - h * 0.55);
        c.closePath();
        c.fill();

        c.fillStyle = '#3d4a47';
        c.fillRect(x - 15, y - 40, 30, 40);

        c.fillStyle = '#c9e4e0';
        c.fillRect(x - w / 2 + 18, y - h * 0.35, 20, 20);
        c.fillRect(x + w / 2 - 38, y - h * 0.35, 20, 20);

        c.strokeStyle = 'rgba(0,0,0,.15)';
        c.lineWidth = 2;
        c.strokeRect(x - w / 2, y - h * 0.55, w, h * 0.55);
      }

      function drawForeground() {
        foregroundCanvas.width = W * dpr;
        foregroundCanvas.height = H * dpr;
        foregroundCanvas.style.width = W + 'px';
        foregroundCanvas.style.height = H + 'px';
        foregroundCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        foregroundCtx.clearRect(0, 0, W, H);

        const groundTop = H * 0.78;
        const ground = foregroundCtx.createLinearGradient(0, groundTop, 0, H);
        ground.addColorStop(0, '#446354');
        ground.addColorStop(1, '#2c4326');
        foregroundCtx.fillStyle = ground;
        foregroundCtx.fillRect(0, groundTop, W, H - groundTop);

        if (treeSeed.length === 0) {
          const count = Math.max(6, Math.floor(W / 140));
          for (let i = 0; i < count; i++) {
            treeSeed.push({
              x: Math.random(),
              scale: 0.55 + Math.random() * 0.6,
              dark: Math.random() > 0.5
            });
          }
        }
        for (let t = 0; t < treeSeed.length; t++) {
          const ts = treeSeed[t];
          // leave a gap around the house at 50% for visual clarity
          if (ts.x > 0.10 && ts.x < 0.26) continue;
          const tx = ts.x * W;
          const ty = groundTop + 6;
          drawTree(foregroundCtx, tx, ty, 46 * ts.scale, ts.dark ? '#2f4a30' : '#3f5f3a');
        }

        drawHouse(foregroundCtx, W * 0.18, groundTop + 6, 100, 120);
      }

      function getCloudPosition(snapshotTimestamp, now) {
        const ageHours = (now - snapshotTimestamp) / (60 * 60 * 1000);
        const effectiveWidth = W * 1.2;
        return W - (ageHours / state.activeRangeHours) * effectiveWidth;
      }

      function drawCloud(c, x, y, size, opacity, colorHex, rain, time, randoms) {
        const bobAmp = rain ? 5 : 2.5;
        const bobbedY = y +
          Math.sin(time * 0.45 + randoms.bob * 6.28) * bobAmp;
        const rgb = hexToRgb(colorHex);

        c.save();
        c.globalAlpha = opacity;

        const grad = c.createRadialGradient(
          x, bobbedY, 0,
          x, bobbedY, size
        );
        grad.addColorStop(0, rgbToCss(rgb, 1));
        grad.addColorStop(1, rgbToCss(rgb, 0));
        c.fillStyle = grad;

        const left = 0.42 + randoms.shape * 0.08;
        const right = 0.45 + randoms.size * 0.10;
        const crown = 0.46 + randoms.y * 0.10;
        const shoulder = 0.24 + randoms.shape * 0.08;

        c.beginPath();
        c.moveTo(x - size * 0.72, bobbedY + size * 0.12);
        c.quadraticCurveTo(
          x - size * 0.52, bobbedY - size * left,
          x - size * 0.16, bobbedY - size * shoulder
        );
        c.quadraticCurveTo(
          x - size * 0.06, bobbedY - size * crown,
          x + size * 0.18, bobbedY - size * 0.18
        );
        c.quadraticCurveTo(
          x + size * 0.46, bobbedY - size * right,
          x + size * 0.70, bobbedY + size * 0.05
        );
        c.quadraticCurveTo(
          x + size * 0.58, bobbedY + size * 0.28,
          x + size * 0.10, bobbedY + size * 0.30
        );
        c.quadraticCurveTo(
          x - size * 0.42, bobbedY + size * 0.32,
          x - size * 0.72, bobbedY + size * 0.12
        );
        c.closePath();
        c.fill();

        // Only draw rain if cloud is mostly on-screen (avoid edge artifacts).
        if (rain && opacity > 0.3 && x > -120 && x < W + 120) {
          c.globalAlpha = opacity * 0.32;
          c.strokeStyle = rgbToCss(rgb, 1);
          c.lineWidth = 1.2;
          const rainSpan = size * 0.72;
          for (let k = 0; k < 4; k++) {
            const rx = x - rainSpan / 2 +
              k * (rainSpan / 3);
            const ry = bobbedY + size * 0.30;
            c.beginPath();
            c.moveTo(rx, ry);
            c.lineTo(rx - 4, ry + 14);
            c.stroke();
          }
        }
        c.restore();
      }

      function drawSun(c, metric, time) {
        const x = W * 0.78;
        const y = H * 0.20;
        const r = Math.min(W, H) * 0.055;
        const t = clamp((metric - 0.55) / 0.30, 0, 1);
        const eased = t * t * (3 - 2 * t);
        if (eased < 0.01) return;

        c.save();
        c.globalAlpha = eased;
        const glow = c.createRadialGradient(x, y, 0, x, y, r * 3.2);
        glow.addColorStop(0, 'rgba(246,198,91,.55)');
        glow.addColorStop(1, 'rgba(246,198,91,0)');
        c.fillStyle = glow;
        c.beginPath();
        c.arc(x, y, r * 3.2, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#f6c65b';
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }

      function render(time) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(backdropCanvas, 0, 0, W, H);

        drawSun(ctx, state.currentMetric, time);

        const weather = stateFor(state.currentMetric);
        const now = Date.now();

        if (rawData && rawData.rows && rawData.rows.length > 0) {
          // Limit the number of rendered clouds for wide historical ranges.
          // This is visual downsampling only; rawData remains untouched.
          const rows = downsampleData(
            rawData.rows,
            DOWNSAMPLE_TARGET_BUCKETS
          );

          for (let i = 0; i < rows.length; i++) {
            const snapshotTime = new Date(rows[i][0]).getTime();
            const x = getCloudPosition(snapshotTime, now);
            if (x > -180 && x < W + 180) {
              const randoms = cloudRandoms(snapshotTime);
              const y = H * (0.09 + randoms.y * 0.30);
              const size = weather.sizeMid * (0.82 + randoms.size * 0.30);
              const opacity = weather.opacityMid *
                (0.78 + randoms.opacity * 0.24);
              drawCloud(
                ctx,
                x,
                y,
                size,
                opacity,
                weather.color,
                weather.rain,
                time,
                randoms
              );
            }
          }
        }

        ctx.drawImage(foregroundCanvas, 0, 0, W, H);
      }

      function frame(ts) {
        if (lastFrameTs === null) lastFrameTs = ts;
        const dt = Math.min(LANDSCAPE_MAX_FRAME_DT, (ts - lastFrameTs) / 1000);
        lastFrameTs = ts;

        updateTransition(dt);
        render(ts / 1000);

        requestAnimationFrame(frame);
      }

      function init() {
        canvas = document.getElementById('trajectoryWeather');
        if (!canvas) return; // graceful no-op if canvas absent
        ctx = canvas.getContext('2d');

        backdropCanvas = document.createElement('canvas');
        backdropCtx = backdropCanvas.getContext('2d');
        foregroundCanvas = document.createElement('canvas');
        foregroundCtx = foregroundCanvas.getContext('2d');

        window.addEventListener('resize', resize);
        resize();

        if (!started) {
          started = true;
          requestAnimationFrame(frame);
        }
      }

      return {
        init: init,
        setTargetMetric: setTargetMetric,
        setActiveRangeDays: setActiveRangeDays
      };
    })();


    /**
     * Initializes Google Charts, notifications container, and fetches dashboard metrics.
     */
    function init() {
      initNotifications();
      initAdminLink();
      Landscape.init();
      google.charts.load('current', { packages: ['corechart'] });
      google.charts.setOnLoadCallback(fetchData);
      setupResizeHandler();
      setupStalenessUpdateTimer();
      setupAutoFetch();
      setupPageVisibilityHandler();
      if (autoFetchEnabled) {
        startAutoFetch();
      }
    }

    /**
     * Debounced window resize event listener.
     */
    function setupResizeHandler() {
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (rawData) renderCharts();
        }, RESIZE_DEBOUNCE_MS);
      });
    }

    /**
     * Initializes the admin link button with the script project ID.
     */
    function initAdminLink() {
      google.script.run.withSuccessHandler((scriptId) => {
        const adminBtn = document.getElementById('btnAdmin');
        if (adminBtn && scriptId) {
          adminBtn.href = 'https://script.google.com/home/projects/' + scriptId + '/edit';
        }
      }).getScriptProjectId();
    }

    /**
     * Sets up timer to update relative age ("xx ago") every 10 seconds without fetching data.
     */
    function setupStalenessUpdateTimer() {
      stalenessUpdateTimer = setInterval(() => {
        if (lastSnapshotTime) {
          updateStalenessDisplay();
        }
      }, STALENESS_UPDATE_INTERVAL_MS);
    }

    /**
     * Sets up auto-fetch background polling to refresh sheet data periodically.
     */
    function setupAutoFetch() {
      // Check if toggle exists and is enabled
      const autoFetchCheckbox = document.getElementById('toggleAutoFetch');
      if (autoFetchCheckbox) {
        autoFetchCheckbox.addEventListener('change', (e) => {
          autoFetchEnabled = e.target.checked;
          if (autoFetchEnabled) {
            startAutoFetch();
          } else {
            stopAutoFetch();
          }
        });
      }

      // Check if interval selector exists
      const intervalSelect = document.getElementById('autoFetchInterval');
      if (intervalSelect) {
        intervalSelect.addEventListener('change', (e) => {
          autoFetchIntervalMs = Number(e.target.value) * 60 * 1000; // Convert minutes to ms (constant)
          // Restart timer with new interval if enabled
          if (autoFetchEnabled) {
            stopAutoFetch();
            startAutoFetch();
          }
        });
      }
    }

    /**
     * Starts the background auto-fetch timer.
     */
    function startAutoFetch() {
      if (autoFetchTimer) return; // Already running
      autoFetchTimer = setInterval(performAutoFetch, autoFetchIntervalMs);
    }

    /**
     * Stops the background auto-fetch timer.
     */
    function stopAutoFetch() {
      if (autoFetchTimer) {
        clearInterval(autoFetchTimer);
        autoFetchTimer = null;
      }
    }

    /**
     * Performs a background data refresh from sheet (no Tasks API call).
     */
    function performAutoFetch() {
      // Silently fetch data; only show errors
      google.script.run
        .withSuccessHandler((data) => {
          lastAutoFetchTime = Date.now();
          onDataLoaded(data);
        })
        .withFailureHandler((error) => {
          console.error('Auto-fetch error:', error);
        })
        .getDashboardData();
    }

    /**
     * Sets up Page Visibility API to pause/resume auto-fetch when tab is hidden/visible.
     * On focus regain, fetches immediately if the timer expired during sleep.
     */
    function setupPageVisibilityHandler() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Tab is hidden: pause auto-fetch timer
          if (autoFetchEnabled) {
            stopAutoFetch();
          }
        } else {
          // Tab is visible: check if fetch is overdue, then restart timer
          if (autoFetchEnabled) {
            const timeSinceLastFetch = Date.now() - lastAutoFetchTime;
            if (timeSinceLastFetch >= autoFetchIntervalMs) {
              // Fetch immediately since timer expired
              performAutoFetch();
            }
            // (Re)start timer for future fetches
            startAutoFetch();
          }
        }
      });
    }

    /**
     * Initializes dynamic notification container in DOM.
     */
    function initNotifications() {
      if (!document.getElementById('notificationContainer')) {
        const container = document.createElement('div');
        container.id = 'notificationContainer';
        container.className = 'notification-container';
        document.body.appendChild(container);
      }
    }

    /**
     * Displays a compact notification bubble with auto-dismiss.
     * @param {string} message - Text content (supports newlines)
     * @param {string} icon - Emoji icon
     * @param {string} type - 'success' | 'error' | 'info'
     * @param {number} durationMs - Auto-dismiss timeout (ms)
     */
    function showNotification(message, icon, type = 'info', durationMs = 3000) {
      initNotifications();
      const container = document.getElementById('notificationContainer');
      if (!container) return;

      const bubble = document.createElement('div');
      bubble.className = 'notification-bubble ' + type;
      bubble.innerHTML = `
        <span class="notification-icon">${icon}</span>
        <span class="notification-text">${message}</span>
        <button class="notification-dismiss" title="Dismiss">×</button>
      `;

      const dismissBtn = bubble.querySelector('.notification-dismiss');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          bubble.classList.add('dismissing');
          setTimeout(() => bubble.remove(), NOTIFICATION_ANIMATION_MS);
        });
      }

      container.appendChild(bubble);

      // Keep max 3 bubbles visible at once
      while (container.children.length > 3) {
        container.removeChild(container.firstChild);
      }

      if (durationMs > 0) {
        setTimeout(() => {
          if (bubble.parentElement) {
            bubble.classList.add('dismissing');
            setTimeout(() => bubble.remove(), NOTIFICATION_ANIMATION_MS);
          }
        }, durationMs);
      }
    }

    /**
     * Fetches historical time-series data from backend RPC.
     */
    function fetchData() {
      showStatus('Loading data from Google Sheet...', 'info');
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .getDashboardData();
    }

    /**
     * Handles successful data reception from Apps Script.
     * @param {Object} data - { headers, rows, sheetUrl, triggerActive }
     */
    function onDataLoaded(data) {
      if (!data || !Array.isArray(data.rows)) {
        showStatus('Received invalid data format from server.', 'error');
        return;
      }

      rawData = JSON.parse(JSON.stringify(data));
      hideStatus();

      // Set sheet-fetch timestamp on every successful data load
      lastSheetFetchTime = Date.now();

      if (data.sheetUrl) {
        const link = document.getElementById('sheetLink');
        if (link) link.href = data.sheetUrl;
      }

      const triggerBox = document.getElementById('toggleAutoTrigger');
      if (triggerBox) {
        triggerBox.checked = (typeof data.triggerActive === 'boolean') ? data.triggerActive : true;
      }

      updateKPIsAndStaleness();
      renderCharts();
      renderTopOverdueTasks(data.topOverdueTasksTopX || []);

      Landscape.setActiveRangeDays(activeRangeDays);
      Landscape.setTargetMetric(calculateMetricForRange(rawData.rows, activeRangeDays === 'all' ? LANDSCAPE_ALL_RANGE_WINDOW_DAYS : activeRangeDays));
    }

    /**
     * Handles data load or sync errors with descriptive messages.
     * @param {Error|Object|string} err
     */
    function onDataError(err) {
      const msg = (err && (err.message || err.toString())) || 'Unknown server error';
      showStatus('Operation failed: ' + msg, 'error');
      showNotification(`Error\n${msg}`, '❌', 'error', NOTIFICATION_ERROR_DURATION_MS);
    }

    /**
     * Updates top KPI cards and staleness indicator. Stores snapshot time for relative age updates.
     */
    function updateKPIsAndStaleness() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;

      const rows = rawData.rows;
      const latest = rows[rows.length - 1];

      const totalOpen = typeof latest[1] === 'number' ? latest[1] : 0;
      const completed = typeof latest[2] === 'number' ? latest[2] : 0;
      const overdue = typeof latest[3] === 'number' ? latest[3] : 0;
      const severity = typeof latest[4] === 'number' ? latest[4] : 0;
      const onTime = Math.max(0, totalOpen - overdue);

      setElemText('kpiOpen', totalOpen);
      setElemText('kpiOpenSubtext', onTime + ' on-time + ' + overdue + ' overdue');
      setElemText('kpiCompleted', completed);
      setElemText('kpiOverdue', overdue);
      setElemText('kpiSeverity', severity.toFixed(1));

      const lastDate = new Date(latest[0]);
      if (!isNaN(lastDate.getTime())) {
        lastSnapshotTime = lastDate.getTime();
        updateStalenessDisplay();
      }

      calculateVelocity(rows);
      updateBacklogEstimate(rows);
    }

    /**
     * Updates the relative age display ("xx min ago") without fetching data.
     * Called every 10 seconds by timer, and immediately after data fetch.
     */
    function updateStalenessDisplay() {
      if (lastSnapshotTime) {
        const diffMins = Math.floor((Date.now() - lastSnapshotTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSnapshotTime);

        setElemText('lastSnapshotAge',
          'Last snapshot: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
      }

      if (lastSheetFetchTime) {
        const diffMins = Math.floor((Date.now() - lastSheetFetchTime) / 60000);
        const timeAgoStr = formatTimeAgo(diffMins);
        const tzAbbr = getLocalTimezoneLabel();
        const lastDate = new Date(lastSheetFetchTime);
        
        const elem = document.getElementById('lastSheetFetchAge');
        if (elem) {
          elem.style.display = 'block';
          setElemText('lastSheetFetchAge',
            'Last sheet fetch: ' + lastDate.toLocaleString() + ' ' + tzAbbr + ' (' + timeAgoStr + ')');
        }
      }
    }

    /**
     * Formats relative time string for display.
     * @param {number} minutes - Minutes elapsed
     * @return {string}
     */
    function formatTimeAgo(minutes) {
      if (minutes < 1) return 'Just now';
      if (minutes < 60) return Math.floor(minutes) + ' min ago';
      const hours = minutes / 60;
      if (hours < 24) return hours.toFixed(1) + ' hr ago';
      return Math.floor(hours / 24) + ' day' + (hours >= 48 ? 's' : '') + ' ago';
    }

    /**
     * Calculates task addition rate over the selected historical window.
     * Addition rate = (open_start - open_end + completed_in_period) / days_elapsed
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks added per day
     */
    /**
     * Filters rows to a time window without modifying the original array.
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Range (3, 7, 14, 30, or 'all')
     * @return {Array<Array<any>>} - Filtered rows in the window
     */
    function getWindowRows(rows, rangeDays) {
      if (!rows) return [];

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * MS_PER_DAY);

      return rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });
    }

    /**
     * Calculates total tasks added in a window using addition formula.
     * @param {Array<Array<any>>} windowRows - Rows filtered to the window
     * @return {number} - Tasks added in the period
     */
    function calculateTasksAdded(windowRows) {
      if (!windowRows || windowRows.length < 2) return 0;

      const oldestOpen = typeof windowRows[0][1] === 'number' ? windowRows[0][1] : 0;
      const newestOpen = typeof windowRows[windowRows.length - 1][1] === 'number' ? windowRows[windowRows.length - 1][1] : 0;
      const completedInPeriod = calculateCompletionsInWindow(windowRows);

      // Tasks added = (open_start - open_end + completed)
      return Math.max(0, oldestOpen - newestOpen + completedInPeriod);
    }

    function calculateAdditionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const windowRows = getWindowRows(rows, rangeDays);
      if (windowRows.length < 2) return 0;

      const tasksAdded = calculateTasksAdded(windowRows);
      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;

      return tasksAdded / elapsedDays;
    }

    /**
     * Sums positive completion deltas in a window (ignores purges/deletes).
     * @param {Array<Array<any>>} windowRows - Snapshot rows in the window
     * @return {number} - Total completions
     */
    function calculateCompletionsInWindow(windowRows) {
      let total = 0;
      for (let i = 1; i < windowRows.length; i++) {
        const delta = windowRows[i][2] - windowRows[i - 1][2];
        if (delta > 0) total += delta;
      }
      return total;
    }

    /**
     * Calculates completion rate over the selected historical window.
     * @param {Array<Array<any>>} rows - All snapshot rows
     * @param {number|string} rangeDays - Selected range (3, 7, 14, 30, or 'all')
     * @return {number} - Tasks completed per day
     */
    function calculateCompletionRate(rows, rangeDays) {
      if (!rows || rows.length < 2) return 0;

      const now = Date.now();
      const cutoff = rangeDays === 'all'
        ? null
        : new Date(now - (Number(rangeDays) || 30) * MS_PER_DAY);

      const windowRows = rows.filter(r => {
        if (!cutoff) return true;
        const t = new Date(r[0]).getTime();
        return t >= cutoff.getTime();
      });

      if (windowRows.length < 2) return 0;

      const completions = calculateCompletionsInWindow(windowRows);
      const oldestTime = new Date(windowRows[0][0]).getTime();
      const newestTime = new Date(windowRows[windowRows.length - 1][0]).getTime();
      const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;

      return completions / elapsedDays;
    }

    /**
     * Calculates estimated days to backlog completion.
     * @param {number} currentOpen - Current open task count
     * @param {number} completionRate - Tasks completed per day
     * @param {number} additionRate - Tasks added per day
     * @return {string|number} - Days to completion, "Cannot estimate", or "∞"
     */
    function calculateDaysToCompletion(currentOpen, completionRate, additionRate) {
      if (currentOpen <= 0) return '0';
      if (completionRate <= additionRate) return 'Cannot estimate';

      const netRate = completionRate - additionRate;
      const days = currentOpen / netRate;
      if (!isFinite(days) || days < 0) return 'Cannot estimate';

      // Return as integer if >= 1 day, else 1 decimal place
      if (days >= 1) return Math.round(days).toString();
      return days.toFixed(1);
    }

    /**
     * Determines status class based on ETA days.
     * @param {number} days - Estimated days to completion
     * @return {string} - 'status-good', 'status-caution', or 'status-warning'
     */
    function getETAStatusClass(days) {
      if (typeof days !== 'number' || !isFinite(days)) return '';
      if (days <= ETA_THRESHOLD_GOOD) return 'status-good';
      if (days <= ETA_THRESHOLD_CAUTION) return 'status-caution';
      return 'status-warning';
    }

    /**
     * Updates backlog completion estimate in the UI.
     * Called from updateKPIsAndStaleness after calculating completion rate.
     */
    function updateBacklogEstimate(rows) {
      const estCard = document.getElementById('backlogEstimateCard');
      if (!estCard) return;

      if (!rows || rows.length === 0) {
        estCard.style.display = 'none';
        return;
      }

      const currentOpen = typeof rows[rows.length - 1][1] === 'number' ? rows[rows.length - 1][1] : 0;
      const completionRate = calculateCompletionRate(rows, activeRangeDays);
      const additionRate = calculateAdditionRate(rows, activeRangeDays);
      const estimate = calculateDaysToCompletion(currentOpen, completionRate, additionRate);

      // Show card unless backlog is zero
      if (estimate === '0') {
        estCard.style.display = 'none';
      } else {
        estCard.style.display = 'block';
        const label = document.getElementById('backlogEstimateValue');
        const note = document.getElementById('backlogEstimateNote');
        const counts = document.getElementById('backlogCountsNote');
        
        if (label) {
          label.textContent = estimate;
          // Use a smaller font for text-based values so they fit on one line
          label.classList.toggle('value-compact', isNaN(Number(estimate)));
          
          // Apply status coloring based on numeric ETA
          const numDays = parseFloat(estimate);
          const statusClass = getETAStatusClass(numDays);
          label.className = 'value ' + statusClass;
          estCard.className = 'card card-purple ' + statusClass;
        }
        
        if (note) {
          if (estimate === 'Cannot estimate') {
            note.textContent = 'Adding ~' + additionRate.toFixed(1) + '/day vs completing ~' + completionRate.toFixed(1) + '/day';
          } else {
            const rangeLabel = activeRangeDays === 'all' ? 'all time' : activeRangeDays + ' days';
            note.textContent = 'Based on rates over past ' + rangeLabel;
          }
        }
        
        // Display raw counts only when completion rate > addition rate and open > 0
        if (counts && completionRate > additionRate && currentOpen > 0) {
          const windowRows = getWindowRows(rows, activeRangeDays);
          const tasksAdded = calculateTasksAdded(windowRows);
          const tasksCompleted = calculateCompletionsInWindow(windowRows);
          counts.textContent = tasksAdded + ' added / ' + tasksCompleted + ' completed this period';
          counts.style.display = 'block';
        } else if (counts) {
          counts.style.display = 'none';
        }
      }
    }

    /**
     * Computes the trajectory-weather metric for a given display range, using a
     * fixed 14-day baseline (or all available history if shorter) as the stable
     * reference point. Only the "recent" window scales with the selected range;
     * the baseline never does. See landscape-extension-design-brief.md section 2.
     * @param {Array<Array<any>>} rows - Snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} rangeDays - Active display range in days (30 substituted for 'all')
     * @return {number} - Metric in [0, 1], where 0.5 is neutral/steady
     */
    function calculateMetricForRange(rows, rangeDays) {
      if (!rows || rows.length < 2) return LANDSCAPE_METRIC_NEUTRAL;

      const now = Date.now();

      // Determine baseline window: 14 days, or all available history if shorter.
      const earliestTime = new Date(rows[0][0]).getTime();
      const availableHistoryDays = (now - earliestTime) / MS_PER_DAY;
      const baselineWindowDays = Math.min(LANDSCAPE_BASELINE_WINDOW_DAYS, Math.max(1, availableHistoryDays));

      const sumPositiveDeltas = (windowDays) => {
        const cutoff = now - windowDays * MS_PER_DAY;
        const windowRows = rows.filter(r => new Date(r[0]).getTime() >= cutoff);
        if (windowRows.length < 2) return { total: 0, elapsedDays: 0 };

        let total = 0;
        for (let i = 1; i < windowRows.length; i++) {
          const delta = windowRows[i][2] - windowRows[i - 1][2];
          if (delta > 0) total += delta;
        }
        const oldest = new Date(windowRows[0][0]).getTime();
        const newest = new Date(windowRows[windowRows.length - 1][0]).getTime();
        const elapsedDays = Math.max(1, newest - oldest) / MS_PER_DAY;
        return { total: total, elapsedDays: elapsedDays };
      };

      const baseline = sumPositiveDeltas(baselineWindowDays);
      const recent = sumPositiveDeltas(rangeDays);

      if (baseline.total <= 0 || baseline.elapsedDays <= 0) {
        return LANDSCAPE_METRIC_NEUTRAL;
      }

      const velocityBaseline = baseline.total / baseline.elapsedDays;
      const velocityRecent = recent.total / recent.elapsedDays;

      if (velocityBaseline <= 0) return LANDSCAPE_METRIC_NEUTRAL;

      const trendRatio = velocityRecent / velocityBaseline;
      const metric = (trendRatio - LANDSCAPE_TREND_CENTER) / LANDSCAPE_TREND_SCALE;
      return Math.max(0, Math.min(1, metric));
    }

    /**
     * Calculates completion throughput velocity over 3 time windows.
     * Sums only positive increments between snapshots to survive purges/deletes.
     * @param {Array<Array<any>>} rows
     */
    function calculateVelocity(rows) {
      const calculate = (days) => {
        const cutoff = Date.now() - days * MS_PER_DAY;
        const recentRows = rows.filter(r =>
          new Date(r[0]).getTime() >= cutoff
        );

        if (recentRows.length < 2) return { value: '-', status: '' };

        let totalCompletions = 0;
        for (let i = 1; i < recentRows.length; i++) {
          const delta = recentRows[i][2] - recentRows[i - 1][2];
          if (delta > 0) totalCompletions += delta;
        }

        const oldestTime = new Date(recentRows[0][0]).getTime();
        const newestTime = new Date(recentRows[recentRows.length - 1][0]).getTime();
        const elapsedDays = Math.max(1, newestTime - oldestTime) / MS_PER_DAY;
        const velocity = totalCompletions / elapsedDays;
        
        // Calculate implied ETA based on current open and velocity
        const currentOpen = typeof recentRows[recentRows.length - 1][1] === 'number' ? recentRows[recentRows.length - 1][1] : 0;
        const impliedETA = velocity > 0 ? currentOpen / velocity : Infinity;
        
        return {
          value: velocity.toFixed(1),
          status: getETAStatusClass(impliedETA)
        };
      };

      const vel1d = calculate(VELOCITY_WINDOW_1D);
      const vel3d = calculate(VELOCITY_WINDOW_3D);
      const vel7d = calculate(VELOCITY_WINDOW_7D);

      const velocitySubtext = document.getElementById('kpiVelocitySubtext');
      if (velocitySubtext) {
        velocitySubtext.innerHTML =
          '<span class="' + vel1d.status + '">24h: ' + vel1d.value + '</span>' +
          ' \u00a0 <span class="' + vel3d.status + '">3d: ' + vel3d.value + '</span>' +
          ' \u00a0 <span class="' + vel7d.status + '">7d: ' + vel7d.value + '</span> /day';
      }
    }

    /**
     * Re-renders the primary chart.
     */
    function renderCharts() {
      if (!rawData || !rawData.rows || rawData.rows.length === 0) return;
      drawStackedLineComboChart();
    }

    /**
     * Helper to safely read checkbox state with DOM null guard.
     */
    function isChecked(elemId) {
      const el = document.getElementById(elemId);
      return el ? Boolean(el.checked) : false;
    }

    /**
     * Safe DOM text updater with null guard.
     */
    function setElemText(elemId, text) {
      const el = document.getElementById(elemId);
      if (el) el.textContent = text;
    }

    /**
     * Retrieves local timezone label.
     */
    function getLocalTimezoneLabel() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      } catch (e) {
        return 'Local';
      }
    }

    /**
     * Downsamples data to reduce rendered points while preserving trend.
     * Uses binning: groups consecutive rows into buckets and keeps the latest in each bucket.
     * @param {Array<Array<any>>} rows - Array of snapshot rows [timestamp, open, completed, overdue, severity]
     * @param {number} targetBuckets - Target number of buckets (default 50)
     * @returns {Array<Array<any>>} - Downsampled rows
     */
    function downsampleData(rows, targetBuckets = DOWNSAMPLE_TARGET_BUCKETS) {
      if (rows.length <= targetBuckets) return rows;

      const bucketSize = Math.ceil(rows.length / targetBuckets);
      const downsampled = [];

      for (let i = 0; i < rows.length; i += bucketSize) {
        const bucket = rows.slice(i, i + bucketSize);
        // Keep the latest (last) row in each bucket
        downsampled.push(bucket[bucket.length - 1]);
      }

      return downsampled;
    }

    /**
     * Calculates rolling average for a single data column.
     * Uses trailing window: avg[i] = mean(data[i-window:i])
     * @param {Array<number>} data - Array of numeric values
     * @param {number} windowSize - Window size for averaging
     * @returns {Array<number>} - Averaged values (same length as input)
     */
    function calculateRollingAverage(data, windowSize) {
      const result = [];
      for (let i = 0; i < data.length; i++) {
        const start = Math.max(0, i - windowSize + 1);
        const end = i + 1;
        const window = data.slice(start, end);
        const avg = window.reduce((sum, val) => sum + val, 0) / window.length;
        result.push(avg);
      }
      return result;
    }

    /**
     * Computes weekend date ranges (Saturday 00:00 to Monday 00:00, local time)
     * overlapping the given [minDate, maxDate] window. Clamps ranges to the window.
     * @param {Date} minDate
     * @param {Date} maxDate
     * @return {Array<{start: Date, end: Date}>}
     */
    function getWeekendRanges(minDate, maxDate) {
      const ranges = [];
      const cursor = new Date(minDate);
      cursor.setHours(0, 0, 0, 0);

      while (cursor <= maxDate) {
        if (cursor.getDay() === 6) { // Saturday: weekend starts
          const weekendStart = new Date(cursor);
          const weekendEnd = new Date(cursor);
          weekendEnd.setDate(weekendEnd.getDate() + 2); // Monday 00:00

          ranges.push({
            start: weekendStart < minDate ? minDate : weekendStart,
            end: weekendEnd > maxDate ? maxDate : weekendEnd
          });
          cursor.setDate(cursor.getDate() + 2);
        } else {
          cursor.setDate(cursor.getDate() + 1);
        }
      }

      return ranges;
    }

    /**
     * Overlays translucent vertical bands over weekend date ranges on the chart.
     * Must be called after the chart's 'ready' event, since it relies on
     * getChartLayoutInterface() for pixel positioning.
     * @param {google.visualization.ComboChart} chart
     * @param {google.visualization.DataTable} dataTable
     * @param {HTMLElement} container
     */
    function renderWeekendBands(chart, dataTable, container) {
      const numRows = dataTable.getNumberOfRows();
      if (numRows === 0) return;

      const minDate = dataTable.getValue(0, 0);
      const maxDate = dataTable.getValue(numRows - 1, 0);
      if (!(minDate instanceof Date) || !(maxDate instanceof Date)) return;

      const layout = chart.getChartLayoutInterface();
      const chartArea = layout.getChartAreaBoundingBox();
      const weekends = getWeekendRanges(minDate, maxDate);

      weekends.forEach((range) => {
        const x1 = layout.getXLocation(range.start);
        const x2 = layout.getXLocation(range.end);
        const left = Math.min(x1, x2);
        const width = Math.abs(x2 - x1);
        if (width <= 0) return;

        const band = document.createElement('div');
        band.className = 'weekend-band';
        band.style.position = 'absolute';
        band.style.left = left + 'px';
        band.style.top = chartArea.top + 'px';
        band.style.width = width + 'px';
        band.style.height = chartArea.height + 'px';
        band.style.background = WEEKEND_BAND_COLOR;
        band.style.pointerEvents = 'none';
        band.style.zIndex = '1';
        container.appendChild(band);
      });
    }

    /**
     * Builds and draws the Stacked Line/Area Chart with Overdue Severity Line Overlay.
     */
    function drawStackedLineComboChart() {
      const chartContainer = document.getElementById('mainChart');
      if (!chartContainer) return;

      const dataTable = buildDecomposedDataTable();
      if (!dataTable || dataTable.getNumberOfRows() === 0) {
        chartContainer.innerHTML = '<div class="loading-spinner">No snapshots available for the selected date range.</div>';
        return;
      }

      const dataView = new google.visualization.DataView(dataTable);
      const visibleCols = [0]; // Time column
      const seriesConfig = {};
      let activeSeriesIdx = 0;

      const showOpen = isChecked('toggleOpen');
      const showOverdue = isChecked('toggleOverdue');
      const showCompleted = isChecked('toggleCompleted');
      const showSeverity = isChecked('toggleSeverity');
      const showRollingAvg = isChecked('toggleRollingAvg');

      // 1. Stacked Lines/Areas on Axis 0 (mutually exclusive segments)
      // Order: Overdue (base/debt) → On-Time Open → Completed (productive)
      if (showOverdue) {
        visibleCols.push(2); // Overdue (base layer)
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.overdue,
          areaOpacity: 0.35,
          lineWidth: 3
        };
      }
      if (showOpen) {
        visibleCols.push(1); // On-Time Open
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.onTimeOpen,
          areaOpacity: 0.25,
          lineWidth: 3
        };
      }
      if (showCompleted) {
        visibleCols.push(3); // Completed
        seriesConfig[activeSeriesIdx++] = {
          type: 'area',
          targetAxisIndex: 0,
          color: SERIES_COLORS.completed,
          areaOpacity: 0.20,
          lineWidth: 2
        };
      }

      // 2. Line Overlay on Axis 1 (Severity Debt Score)
      if (showSeverity) {
        visibleCols.push(4); // Severity
        seriesConfig[activeSeriesIdx++] = {
          type: 'line',
          targetAxisIndex: 1,
          color: SERIES_COLORS.severity,
          lineWidth: 3,
          pointSize: 5
        };
      }

      // 3. Rolling Average Lines (if enabled)
      if (showRollingAvg && visibleCols.length > 1) {
        // Compute window size based on data points
        const numRows = dataTable.getNumberOfRows();
        let windowSize = Math.ceil(numRows / ROLLING_AVG_TARGET_BUCKETS);
        windowSize = Math.max(ROLLING_AVG_WINDOW_MIN, Math.min(windowSize, ROLLING_AVG_WINDOW_MAX));

        // Calculate raw rolling averages for each visible series
        const rawAverages = {};
        
        if (showOverdue) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 2) === 'number' ? dataTable.getValue(row, 2) : 0);
          }
          rawAverages[2] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showOpen) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 1) === 'number' ? dataTable.getValue(row, 1) : 0);
          }
          rawAverages[1] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showCompleted) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 3) === 'number' ? dataTable.getValue(row, 3) : 0);
          }
          rawAverages[3] = calculateRollingAverage(rawVals, windowSize);
        }
        
        if (showSeverity) {
          const rawVals = [];
          for (let row = 0; row < numRows; row++) {
            rawVals.push(typeof dataTable.getValue(row, 4) === 'number' ? dataTable.getValue(row, 4) : 0);
          }
          rawAverages[4] = calculateRollingAverage(rawVals, windowSize);
        }

        // Apply cumulative stacking to non-severity averages
        // Stack order: Overdue (base) → On-Time Open → Completed
        // stackBase accumulates RAW averages only (not the already-stacked
        // result), otherwise each layer double-counts everything beneath it.
        const stackedAverages = {};
        let stackBase = new Array(numRows).fill(0);

        if (showOverdue) {
          stackedAverages[2] = rawAverages[2].map((val, i) => stackBase[i] + val);
          stackBase = stackBase.map((val, i) => val + rawAverages[2][i]);
        }
        
        if (showOpen) {
          stackedAverages[1] = rawAverages[1].map((val, i) => stackBase[i] + val);
          stackBase = stackBase.map((val, i) => val + rawAverages[1][i]);
        }
        
        if (showCompleted) {
          stackedAverages[3] = rawAverages[3].map((val, i) => stackBase[i] + val);
        }
        
        // Severity remains independent (not stacked)
        if (showSeverity) {
          stackedAverages[4] = rawAverages[4];
        }

        // Add rolling average columns to the data table
        const colCount = dataTable.getNumberOfColumns();
        const avgColMap = {};
        const orderedCols = [2, 1, 3, 4].filter(c => rawAverages[c]);

        for (let i = 0; i < orderedCols.length; i++) {
          const colIdx = orderedCols[i];
          dataTable.addColumn('number', 'Avg ' + dataTable.getColumnLabel(colIdx));
          avgColMap[colIdx] = colCount + i;

          // Populate with stacked average values
          for (let row = 0; row < numRows; row++) {
            dataTable.setValue(row, avgColMap[colIdx], stackedAverages[colIdx][row]);
          }
        }

        // Add rolling average columns to visible columns and configure styling
        for (let colIdx of orderedCols) {
          const avgColIdx = avgColMap[colIdx];
          visibleCols.push(avgColIdx);

          let color = SERIES_COLORS.onTimeOpen;
          let axisIdx = 0;
          if (colIdx === 2) color = SERIES_COLORS.overdue;
          else if (colIdx === 3) color = SERIES_COLORS.completed;
          else if (colIdx === 4) {
            color = SERIES_COLORS.severity;
            axisIdx = 1;
          }

          seriesConfig[activeSeriesIdx++] = {
            type: 'line', // Critical: lines don't participate in stacking
            targetAxisIndex: axisIdx,
            color: color,
            lineWidth: 2,
            lineDashStyle: ROLLING_AVG_LINE_DASH,
            pointSize: 0,
            opacity: ROLLING_AVG_OPACITY
          };
        }
      }

      if (visibleCols.length === 1) {
        chartContainer.innerHTML = '<div class="loading-spinner">Select at least one metric series above to render chart.</div>';
        mainChartInstance = null;
        return;
      }

      // Always recreate the chart instance before drawing. Reusing a ComboChart
      // instance across renders with a different series count/config can leave
      // stale series definitions cached internally, causing the chart to appear
      // unchanged until an unrelated structural change (e.g. adding trend-line
      // columns) forces a full redraw. Clearing and recreating avoids this.
      chartContainer.innerHTML = '';
      mainChartInstance = new google.visualization.ComboChart(chartContainer);

      dataView.setColumns(visibleCols);

      // Format severity column (index 4) to 1 decimal place
      const severityFormatter = new google.visualization.NumberFormat('#.0');
      if (visibleCols.includes(4)) {
        // Find the position of column 4 in visibleCols
        const severityIdx = visibleCols.indexOf(4);
        if (severityIdx !== -1) {
          severityFormatter.format(dataView, severityIdx);
        }
      }

      const tzLabel = getLocalTimezoneLabel();
      const options = {
        seriesType: 'area',
        isStacked: true,
        series: seriesConfig,
        vAxes: {
          0: { title: 'Task Volume (Stacked)', minValue: 0, gridlines: { color: '#f1f3f4' } },
          1: { title: 'Overdue Severity (√days)', minValue: 0, gridlines: { color: 'transparent' } }
        },
        hAxis: {
          title: 'Time (' + tzLabel + ')',
          gridlines: { color: '#f1f3f4' }
        },
        legend: { position: 'top', alignment: 'end' },
        chartArea: { left: 60, right: 70, top: 30, bottom: 60, width: '85%', height: '75%' },
        pointSize: 3,
        interpolateNulls: true,
        backgroundColor: 'transparent'
      };

      if (!mainChartInstance) {
        mainChartInstance = new google.visualization.ComboChart(chartContainer);
      }

      google.visualization.events.addListener(mainChartInstance, 'ready', () => {
        renderWeekendBands(mainChartInstance, dataTable, chartContainer);
      });

      mainChartInstance.draw(dataView, options);
    }

    /**
     * Constructs a decomposed DataTable where open tasks are split into On-Time Open and Overdue.
     */
    function buildDecomposedDataTable() {
      if (!rawData || !rawData.rows) return null;

      const dataTable = new google.visualization.DataTable();
      dataTable.addColumn('datetime', 'Time');
      dataTable.addColumn('number', 'On-Time Open');
      dataTable.addColumn('number', 'Overdue');
      dataTable.addColumn('number', 'Completed');
      dataTable.addColumn('number', 'Overdue Severity (√days)');

      const now = Date.now();
      const cutoff = activeRangeDays === 'all'
        ? null
        : new Date(now - (Number(activeRangeDays) || 30) * MS_PER_DAY);

      const validRows = [];
      for (let i = 0; i < rawData.rows.length; i++) {
        const row = rawData.rows[i];
        if (!row || !row[0]) continue;

        let dateObj = new Date(row[0]);
        if (isNaN(dateObj.getTime())) {
          dateObj = new Date(0);
        }

        if (cutoff && dateObj < cutoff) continue;

        const totalOpen = typeof row[1] === 'number' ? Math.max(0, row[1]) : 0;
        const completed = typeof row[2] === 'number' ? Math.max(0, row[2]) : 0;
        const overdue = typeof row[3] === 'number' ? Math.max(0, row[3]) : 0;
        const severity = typeof row[4] === 'number' ? Math.max(0, row[4]) : 0;

        const onTimeOpen = Math.max(0, totalOpen - overdue);
        validRows.push([dateObj, onTimeOpen, overdue, completed, severity]);
      }

      // Apply downsampling for large datasets
      const downsampledRows = downsampleData(validRows, DOWNSAMPLE_TARGET_BUCKETS);
      dataTable.addRows(downsampledRows);
      return dataTable;
    }

    /**
     * Sanitizes and sets the active date range filter.
     * @param {number|string} range
     */
    function setRangeFilter(range) {
      activeRangeDays = (range === 'all') ? 'all' : (Number(range) || 30);

      const pills = document.querySelectorAll('#rangeFilterGroup .pill');
      pills.forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-range') === String(range));
      });

      // Recalculate KPIs (velocity, backlog estimate) when range changes
      if (rawData && rawData.rows && rawData.rows.length > 0) {
        calculateVelocity(rawData.rows);
        updateBacklogEstimate(rawData.rows);

        const effectiveRangeDays = (activeRangeDays === 'all') ? LANDSCAPE_ALL_RANGE_WINDOW_DAYS : activeRangeDays;
        Landscape.setActiveRangeDays(activeRangeDays);
        Landscape.setTargetMetric(calculateMetricForRange(rawData.rows, effectiveRangeDays));
      }

      renderCharts();
    }

    /**
     * Handles series checkbox toggles and re-renders.
     */
    function updateChartVisibility() {
      renderCharts();
    }

    /**
     * Re-reads existing snapshot rows directly from the Google Sheet without calling Tasks API.
     */
    function handleReloadData() {
      setButtonsDisabled(true);
      showStatus('Reloading data from Google Sheet...', 'info');

      google.script.run
        .withSuccessHandler((data) => {
          setButtonsDisabled(false);
          showStatus('Data reloaded successfully!', 'success');
          showNotification('Data Reloaded\nRefreshing dashboard...', '🔄', 'success', 2000);
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .getDashboardData();
    }

    /**
     * Internal helper: refresh dashboard data from Sheet.
     * Used by destructive actions to auto-refresh without user click.
     */
    function refreshDashboardData() {
      google.script.run
        .withSuccessHandler((data) => {
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          console.error('Auto-refresh error:', err);
        })
        .getDashboardData();
    }

    /**
     * Triggers Manual Sync Now RPC with UI lock.
     */
    function handleSyncNow() {
      setButtonsDisabled(true);
      showStatus('Syncing tasks across all lists from Google Tasks API...', 'info');

      google.script.run
        .withSuccessHandler((data) => {
          setButtonsDisabled(false);
          showStatus('Sync completed successfully!', 'success');
          if (data && data.rows && data.rows.length > 0) {
            const latest = data.rows[data.rows.length - 1];
            showNotification(`Sync Complete\n${latest[1]} open, ${latest[3]} overdue`, '✅', 'success', 3000);
          }
          onDataLoaded(data);
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .syncNow();
    }

    /**
     * Deletes tasks completed more than 8 weeks ago from Google Tasks across all lists.
     */
    function handleDeleteOldCompletedTasks() {
      const confirmed = confirm(
        '⚠️ DELETE OLD COMPLETED TASKS (>8 WEEKS)\n\n' +
        'This will permanently delete tasks that were completed more than 8 weeks ago across all your Google Task lists.\n\n' +
        'Recent completed tasks (<8 weeks) will be kept intact.\n\n' +
        'Proceed?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Deleting tasks completed > 8 weeks ago across all lists...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Delete failed: ' + errMsg, 'error');
            showNotification(`Delete failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showStatus(`Deleted ${result.tasksDeleted} old completed tasks. Refreshing dashboard...`, 'success');
          showNotification(`Old Completed Tasks Deleted\n${result.tasksDeleted} tasks removed (>8w)`, '🗑️', 'success', 4000);
          if (result.data) {
            onDataLoaded(result.data);
          } else {
            fetchData();
          }
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .deleteOldCompletedTasks(8);
    }

    /**
     * Triggers Sync & Clear Completed Tasks RPC with confirmation.
     */
    /**
     * Triggers manual pruning of records older than 1 year to 1 per day.
     */
    function handlePruneOldData() {
      const confirmed = confirm(
        '⚠️ PRUNE DATA OLDER THAN 1 YEAR\n\n' +
        'This will reduce all data older than 12 months to 1 entry per day, removing intermediate snapshots.\n\n' +
        'Your recent data (<1 year) remains untouched.\n\n' +
        'Continue?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Pruning snapshots older than 1 year down to 1 per day...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Prune failed: ' + errMsg, 'error');
            showNotification(`Prune failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showPruneResultModal(result);
          showStatus('Pruning complete. Refreshing dashboard...', 'success');
          showNotification(`Pruned ${result.totalPruned} rows\nReduced to 1/day`, '🧹', 'success', 4000);
          refreshDashboardData();
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .pruneDataOlderThan1Year();
    }

    function handleDownsampleLastYear() {
      const confirmed = confirm(
        '⚠️ DOWNSAMPLE LAST YEAR TO 1/HOUR\n\n' +
        'This will reduce snapshots from the last 365 days to at most 1 entry per rolling 60-minute window, keeping only the latest snapshot in each window.\n\n' +
        'This permanently removes intra-hour data and cannot be undone.\n\n' +
        'Data older than 1 year is not affected by this action.\n\n' +
        'Continue?'
      );
      if (!confirmed) return;

      setButtonsDisabled(true);
      showStatus('Downsampling last year of snapshots to 1 per hour...', 'info');

      google.script.run
        .withSuccessHandler((result) => {
          setButtonsDisabled(false);
          if (!result || !result.success) {
            const errMsg = (result && result.error) || 'Unknown error';
            showStatus('Downsample failed: ' + errMsg, 'error');
            showNotification(`Downsample failed\n${errMsg}`, '❌', 'error', 5000);
            return;
          }

          showDownsampleResultModal(result);
          showStatus('Downsampling complete. Refreshing dashboard...', 'success');
          showNotification(`Removed ${result.totalRemoved} rows\nReduced to 1/hour`, '📉', 'success', 4000);
          refreshDashboardData();
        })
        .withFailureHandler((err) => {
          setButtonsDisabled(false);
          onDataError(err);
        })
        .downsampleLastYearToHourly();
    }

    /**
     * Displays a clean formatted result modal with downsampling statistics.
     * @param {Object} result
     */
    function showDownsampleResultModal(result) {
      const existing = document.getElementById('downsampleResultModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'downsampleResultModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-card">
          <h3>✅ Downsampling Complete</h3>
          <table class="prune-stats-table">
            <tr><td>Total rows before:</td><td>${result.totalBefore}</td></tr>
            <tr><td>Rows removed:</td><td>${result.totalRemoved}</td></tr>
            <tr><td>Rows remaining:</td><td>${result.totalAfter}</td></tr>
            <tr><td>Percentage removed:</td><td>${Number(result.percentageRemoved || 0).toFixed(1)}%</td></tr>
            <tr><td>Execution time:</td><td>${result.durationMs}ms</td></tr>
          </table>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="document.getElementById('downsampleResultModal').remove()">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    /**
     * Displays a clean formatted result modal with pruning statistics.
     * @param {Object} result
     */
    function showPruneResultModal(result) {
      const existing = document.getElementById('pruneResultModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'pruneResultModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-card">
          <h3>✅ Pruning Complete</h3>
          <table class="prune-stats-table">
            <tr><td>Total rows before:</td><td>${result.totalBefore}</td></tr>
            <tr><td>Rows pruned:</td><td>${result.totalPruned}</td></tr>
            <tr><td>Rows remaining:</td><td>${result.totalAfter}</td></tr>
            <tr><td>Percentage removed:</td><td>${Number(result.percentageRemoved || 0).toFixed(1)}%</td></tr>
            <tr><td>Execution time:</td><td>${result.durationMs}ms</td></tr>
          </table>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="document.getElementById('pruneResultModal').remove()">Close</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    /**
     * Toggles 3-hour automated background sync trigger.
     * @param {boolean} enable
     */
    function handleTriggerToggle(enable) {
      showStatus((enable ? 'Enabling' : 'Disabling') + ' automated 3h sync trigger...', 'info');
      google.script.run
        .withSuccessHandler((isActive) => {
          showStatus('Automated background trigger ' + (isActive ? 'enabled' : 'disabled') + '.', 'success');
          showNotification(
            isActive ? 'Auto-sync Enabled\nEvery 3 hours' : 'Auto-sync Disabled\nManual sync only',
            isActive ? '⚡' : '🛑',
            'success',
            2000
          );
          const triggerBox = document.getElementById('toggleAutoTrigger');
          if (triggerBox) triggerBox.checked = isActive;
        })
        .withFailureHandler(onDataError)
        .setTriggerEnabled(enable);
    }

    function setButtonsDisabled(disabled) {
      const btnSync = document.getElementById('btnSyncNow');
      const btnReload = document.getElementById('btnReloadData');
      const btnDeleteOld = document.getElementById('btnDeleteOldCompleted');
      const btnClear = document.getElementById('btnSyncClear');
      const btnDownsample = document.getElementById('btnDownsampleLastYear');
      const btnPrune = document.getElementById('btnPruneOldData');
      if (btnSync) btnSync.disabled = disabled;
      if (btnReload) btnReload.disabled = disabled;
      if (btnDeleteOld) btnDeleteOld.disabled = disabled;
      if (btnClear) btnClear.disabled = disabled;
      if (btnDownsample) btnDownsample.disabled = disabled;
      if (btnPrune) btnPrune.disabled = disabled;
    }

    function showStatus(message, type) {
      const banner = document.getElementById('statusBanner');
      if (!banner) return;
      banner.className = 'status-banner ' + type;
      banner.innerText = message;
      banner.style.display = 'block';
    }

    function hideStatus() {
      const banner = document.getElementById('statusBanner');
      if (banner) banner.style.display = 'none';
    }

    /**
     * Renders the top 3 overdue tasks in the UI.
     * Hides the panel if no tasks exist.
     * @param {Array<Object>} topTasks - Array of top overdue task objects
     */
    function renderTopOverdueTasks(topTasks) {
      const panel = document.getElementById('topOverduePanel');
      const list = document.getElementById('topOverdueList');

      if (!panel || !list) return;

      if (!topTasks || topTasks.length === 0) {
        panel.style.display = 'none';
        return;
      }

      panel.style.display = 'block';
      list.innerHTML = '';

      for (let i = 0; i < topTasks.length; i++) {
        const task = topTasks[i];
        const item = document.createElement('div');
        item.className = 'overdue-task-item';

        const daysOverdue = task.overdueDuration || 0;
        const dayLabel = Math.floor(daysOverdue) === 1 ? 'day' : 'days';

        item.innerHTML = `
          <div class="overdue-task-index">${i + 1}</div>
          <div class="overdue-task-content">
            <div class="overdue-task-title">${escapeHtml(task.title)}</div>
            <div class="overdue-task-meta">
              <div class="overdue-task-meta-item">
                <span>📅</span>
                <span>${escapeHtml(task.dueDate)}</span>
              </div>
              <div class="overdue-task-meta-item">
                <span>📋</span>
                <span>${escapeHtml(task.taskListName)}</span>
              </div>
              <div class="overdue-task-meta-item">
                <span>⏳</span>
                <span>${Math.floor(daysOverdue)} ${dayLabel} overdue</span>
              </div>
            </div>
          </div>
          <div class="overdue-task-severity">√${task.severity.toFixed(1)}</div>
        `;

        list.appendChild(item);
      }
    }

    /**
     * Escapes HTML special characters to prevent XSS.
     * @param {string} text
     * @return {string}
     */
    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, (char) => map[char]);
    }

    // Public API
    return {
      init: init,
      setRangeFilter: setRangeFilter,
      updateChartVisibility: updateChartVisibility,
      handleReloadData: handleReloadData,
      handleSyncNow: handleSyncNow,
      handleDeleteOldCompletedTasks: handleDeleteOldCompletedTasks,
      handleDownsampleLastYear: handleDownsampleLastYear,
      handlePruneOldData: handlePruneOldData,
      handleTriggerToggle: handleTriggerToggle
    };
  })();

  // Initialize on load
  DashboardApp.init();
</script>
